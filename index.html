<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002C66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Meal Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --pri:#00408F;--pri2:#0A54B0;--pri-d:#002C66;--pri-soft:#EAF1FB;--pri-line:#C9D8EE;
  --acc:#D14029;--acc2:#E8664F;--acc-d:#B5321E;--acc-soft:#FCEEEB;
  --bg:#F5F7FB;--card:#FFFFFF;--ink:#0C2347;--ink2:#3B4A63;--muted:#8792A6;--line:#E7ECF3;
  --ok:#17A673;--ok-soft:#E6F6EF;
  --r:22px;--shadow:0 14px 34px -16px rgba(0,44,102,.22),0 2px 6px rgba(0,44,102,.04);
  --ease:cubic-bezier(.2,.9,.25,1);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit',system-ui,-apple-system,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
b,strong{font-weight:500}
img{-webkit-user-drag:none;user-select:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:520px;margin:0 auto;position:relative;min-height:100vh;padding-bottom:calc(118px + var(--sb))}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 80% 0%,#0A54B0 0%,#002C66 62%);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
.splash-in{text-align:center;color:#fff}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,var(--acc-d));display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 18px 40px -10px rgba(209,64,41,.65);animation:pulse 1.6s ease-in-out infinite}
.logo .ic{width:36px;height:36px;stroke-width:1.6;color:#fff}
.splash-in h1{margin:0;font-weight:500;letter-spacing:.28em;font-size:15px}
.splash-in p{margin:6px 0 0;font-size:12px;opacity:.6;letter-spacing:.06em}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(16px + var(--st)) 20px 84px;border-radius:0 0 34px 34px;background:linear-gradient(160deg,#002C66 0%,#00408F 55%,#0A54B0 100%)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 22px);pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(44px);opacity:.5;animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:220px;height:220px;background:var(--acc);top:-100px;right:-70px}
.b2{width:200px;height:200px;background:#4F9BFF;bottom:-120px;left:-70px;animation-delay:-5s;opacity:.4}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-24px,18px) scale(1.08)}66%{transform:translate(16px,-12px) scale(.95)}}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.2em;font-weight:500;min-width:0;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc2),var(--acc-d));display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(209,64,41,.6);flex:none}
.brand .mark .ic{width:18px;height:18px;color:#fff}
.demo-badge{font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.16)}
.mode{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:99px;padding:7px 12px 7px 10px;font-size:12px;transition:.3s var(--ease);white-space:nowrap;flex:none}
.mode .ic{width:16px;height:16px}
.mode.on{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;box-shadow:0 8px 20px -6px rgba(209,64,41,.7)}
.hero-text{position:relative;margin-top:24px}
.hero-text small{display:block;font-size:13px;opacity:.7}
.hero-text h1{margin:4px 0 0;font-size:26px;font-weight:500;line-height:1.3}
.hero-text h1 span{color:#FFB4A6}
.hero-text.swap{animation:fadeUp .55s var(--ease)}

/* Layout */
.content{margin-top:-60px;padding:0 16px;position:relative;z-index:2}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.reveal{opacity:0;animation:fadeUp .7s var(--ease) forwards;animation-delay:calc(var(--d,0) * 60ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec-h h3{margin:0;font-size:16px;font-weight:500}
.link{font-size:13px;color:var(--acc);font-weight:400;background:none;border:0;padding:4px 0;flex:none}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Today ring */
.ring-card{display:flex;gap:16px;align-items:center;padding:20px 18px}
.ring-wrap{position:relative;width:128px;height:128px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring-bg{stroke:var(--pri-soft)}
.ring-fg{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset 1.4s var(--ease)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center small{font-size:11px;color:var(--muted);line-height:1.2}
.ring-center b{font-size:34px;font-weight:600;line-height:1.1;color:var(--pri)}
.ring-side{flex:1;min-width:0}
.streak{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.streak small{font-size:12px;color:var(--muted);width:100%}
.streak b{font-size:26px;font-weight:600;color:var(--acc);line-height:1.1}
.streak span{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--pri-soft);color:var(--muted);transition:.3s var(--ease);white-space:nowrap}
.chk::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc);opacity:.5}
.chk.on{background:var(--pri);color:#fff}
.chk.on::before{display:none}
.chk .ic{width:13px;height:13px;stroke-width:2.8;color:#FFB4A6}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:15px 14px 14px;position:relative;overflow:hidden;min-width:0}
.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:74px;height:74px;border-radius:50%;background:var(--acc-soft);opacity:.8}
.stat.dark{background:linear-gradient(150deg,var(--pri2),var(--pri-d));color:#fff}
.stat.dark::after{background:rgba(209,64,41,.3)}
.stat .lbl{font-size:12px;color:var(--muted);position:relative;z-index:1}
.stat.dark .lbl{color:rgba(255,255,255,.7)}
.stat .val{font-size:24px;font-weight:600;margin-top:2px;position:relative;z-index:1;line-height:1.25;white-space:nowrap}
.stat .val small{font-size:12px;font-weight:300;color:var(--muted);margin-left:3px}
.stat.dark .val small{color:rgba(255,255,255,.6)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:99px;margin-top:6px;background:var(--pri-soft);color:var(--ink2);position:relative;z-index:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--acc-soft);color:var(--acc-d)}
.pill.bad{background:#FDE3DE;color:var(--acc-d)}
.stat.dark .pill{background:rgba(255,255,255,.14);color:#fff}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;justify-content:center}
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--pri-soft),#fff);border:1px solid var(--pri-line)}
.banner .ic{color:var(--pri);width:26px;height:26px}
.banner p{margin:0;font-size:13px;flex:1;line-height:1.45}

/* Meals */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 150px;scroll-snap-align:start;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left;transition:transform .2s var(--ease)}
.mini:active{transform:scale(.97)}
.mini .phbox{height:112px}
.mini .mi-b{padding:10px 12px 12px}
.mini h4{margin:4px 0 0;font-size:14px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}

.phbox{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1,#EE8A76),var(--c2,#B5321E));display:grid;place-items:center}
.phbox>.ic{width:30px;height:30px;color:rgba(255,255,255,.85);stroke-width:1.5}
.phbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .6s,transform 1s var(--ease)}
.phbox img.ok{opacity:1;transform:none}
.phbox img.err{display:none}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:400;color:var(--ink2);min-width:0}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc,var(--acc));flex:none}

.datestrip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 54px;height:72px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:transform .35s var(--ease),background .35s}
.dchip small{font-size:11px;color:var(--muted)}
.dchip b{font-size:19px;font-weight:500}
.dchip i{position:absolute;bottom:8px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.dchip.all{flex-basis:64px}
.dchip.all b{font-size:13px}
.dchip.on{background:linear-gradient(160deg,var(--pri2),var(--pri-d));color:#fff;transform:translateY(-3px);box-shadow:0 14px 26px -10px rgba(0,44,102,.6)}
.dchip.on small{color:rgba(255,255,255,.7)}
.dchip.on i{background:#FFB4A6}

.daysum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:14px 8px}
.daysum div{border-right:1px solid var(--line)}
.daysum div:last-child{border:0}
.daysum b{display:block;font-size:20px;font-weight:600;color:var(--pri)}
.daysum b.o{color:var(--acc)}
.daysum small{font-size:11.5px;color:var(--muted)}

.dgroup-h{font-size:13px;color:var(--muted);margin:18px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--line),var(--line) 60%,transparent)}
.mcard{position:relative;display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:10px;margin-bottom:12px;width:100%;border:0;text-align:left;transition:transform .25s var(--ease)}
.mcard:active{transform:scale(.98)}
.mcard::before{content:"";position:absolute;left:-19px;top:22px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--tc,var(--acc))}
.mcard .phbox{width:84px;height:84px;border-radius:15px;flex:none}
.mcard .mc-b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-right:4px}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-top time{font-size:12px;color:var(--muted);flex:none}
.mcard h4{margin:4px 0 2px;font-size:15px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mcard p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:22px;background:var(--acc-soft);display:grid;place-items:center;margin:0 auto 12px}
.empty .eic .ic{color:var(--acc);width:30px;height:30px}
.empty p{margin:0 0 14px;font-size:14px}

/* Body */
.mtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mtiles .stat:first-child{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;transition:background .3s var(--ease),color .3s,border-color .3s;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chart-box{position:relative;height:210px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--pri-soft);border:0;padding:0}
.compare figure img{width:100%;height:100%;object-fit:cover;display:block;animation:fadeIn .6s}
.compare figcaption{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:#fff;background:rgba(0,44,102,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:5px 9px}
.compare figcaption b{font-weight:500}
.compare .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--pri);font-size:12.5px;text-align:center;padding:10px}
.cmp-diff{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.hrow:last-child{border-bottom:0}
.hdate{width:48px;text-align:center;flex:none;background:var(--pri-soft);border-radius:14px;padding:6px 0;position:relative}
.hdate b{display:block;font-size:17px;font-weight:600;line-height:1.1;color:var(--pri)}
.hdate small{font-size:10.5px;color:var(--muted)}
.hdate .cam{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.hdate .cam .ic{width:10px;height:10px;color:#fff;stroke-width:2.4}
.hvals{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;text-align:center;min-width:0}
.hvals span{font-size:13.5px;font-weight:400}
.hvals small{display:block;font-size:10px;color:var(--muted);white-space:nowrap}

/* Profile */
.prof{display:flex;align-items:center;gap:14px}
.avatar{width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg,var(--pri2),var(--pri-d));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:500;flex:none;position:relative}
.avatar::after{content:"";position:absolute;inset:-4px;border-radius:26px;border:2px solid var(--acc);opacity:.45}
.prof h2{margin:0;font-size:19px;font-weight:500;word-break:break-word}
.prof p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:right}
.goal-track{height:10px;border-radius:9px;background:var(--pri-soft);overflow:hidden;margin:10px 0 6px}
.goal-fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc-d));border-radius:9px;transition:width 1.4s var(--ease)}
.formula{font-size:12.5px;color:var(--ink2);line-height:1.6;padding:10px 0;border-bottom:1px dashed var(--line)}
.formula:last-child{border:0}
.formula b{color:var(--pri)}

/* Buttons */
.btn{position:relative;overflow:hidden;border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:400;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--ease),box-shadow .3s;min-height:50px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,var(--acc-d));color:#fff;box-shadow:0 12px 24px -10px rgba(209,64,41,.8)}
.btn-navy{background:var(--pri);color:#fff}
.btn-ghost{background:var(--pri-soft);color:var(--pri)}
.btn-danger{background:var(--acc-soft);color:var(--acc-d)}
.btn-block{width:100%}
.btn[disabled]{opacity:.75;pointer-events:none}
.btn .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
.btn-danger .spin,.btn-ghost .spin{border-color:rgba(0,64,143,.2);border-top-color:currentColor}
@keyframes rot{to{transform:rotate(360deg)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* Nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));width:calc(100% - 24px);max-width:496px;height:66px;background:rgba(0,44,102,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:40;box-shadow:0 20px 44px -14px rgba(0,44,102,.6)}
.nav .tab{background:none;border:0;color:rgba(255,255,255,.55);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;position:relative;transition:color .3s;white-space:nowrap}
.nav .tab .ic{transition:transform .4s var(--ease),color .3s}
.nav .tab.active{color:#fff}
.nav .tab.active .ic{color:#FF9C88;transform:translateY(-2px)}
.nav .tab::after{content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--acc2);transform:scale(0);transition:transform .35s var(--ease)}
.nav .tab.active::after{transform:scale(1)}
.fab{width:58px;height:58px;border-radius:20px;border:0;margin:-34px auto 0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc) 50%,var(--acc-d));box-shadow:0 14px 28px -8px rgba(209,64,41,.75),0 0 0 6px var(--bg);transition:transform .3s var(--ease);position:relative;overflow:hidden}
.fab:active{transform:scale(.92) rotate(90deg)}
.fab .ic{width:28px;height:28px;stroke-width:2.2}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,20,50,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92vh;max-height:92dvh;background:#fff;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .5s var(--ease),visibility 0s .5s;visibility:hidden;z-index:61;display:flex;flex-direction:column}
.sheet.open{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.sheet.drag{transition:none}
.sheet-handle{padding:10px 0 6px;display:grid;place-items:center;touch-action:none;flex:none}
.sheet-handle span{width:44px;height:5px;border-radius:9px;background:#D6DEEA}
.sheet-body{overflow-y:auto;padding:4px 20px calc(24px + var(--sb));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 16px}
.sheet-title h2{margin:0;font-size:20px;font-weight:500}
.xbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--pri-soft);display:grid;place-items:center;color:var(--pri);flex:none}

.choose{display:grid;gap:12px}

.choose b{display:block;font-size:16px;font-weight:500}
.choose small{font-size:12.5px;opacity:.7}

.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px 2px}

.inp:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(0,64,143,.12)}

.unit{position:relative}
.unit .inp{padding-right:46px}
.unit em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.typechips{display:flex;flex-wrap:wrap;gap:8px}
.typechips input{position:absolute;opacity:0;pointer-events:none}
.typechips label{margin:0;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:.25s var(--ease)}
.typechips label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.typechips input:checked+label{background:var(--pri);border-color:var(--pri);color:#fff}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px -20px 0;padding:0 20px 2px}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{font-size:12.5px;padding:5px 12px;background:var(--pri-soft);border-color:transparent;color:var(--pri)}
.seg{display:flex;background:var(--pri-soft);border-radius:14px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;margin:0;text-align:center;padding:10px;border-radius:11px;font-size:14px;color:var(--ink2);transition:.3s var(--ease)}
.seg input:checked+label{background:#fff;color:var(--pri);box-shadow:0 4px 12px -4px rgba(0,44,102,.25);font-weight:400}
.photo-pick{position:relative;height:210px;border-radius:20px;border:2px dashed var(--pri-line);background:var(--pri-soft);display:grid;place-items:center;overflow:hidden;margin-bottom:16px;cursor:pointer}

.poses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pose{position:relative;aspect-ratio:3/4;border-radius:16px;border:2px dashed var(--pri-line);background:var(--pri-soft);overflow:hidden;display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease)}

.pose img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeIn .5s}
.pose .pl{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--pri);font-size:12.5px;text-align:center}

.pose .pt{display:none;position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,44,102,.75);color:#fff;padding:2px 8px;border-radius:99px}

.pose.has{border-style:solid;border-color:transparent}

/* PIN */
#pin{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + var(--st)) 24px calc(30px + var(--sb));color:#fff;background:radial-gradient(120% 70% at 85% 0%,rgba(209,64,41,.38),transparent 60%),linear-gradient(170deg,#00408F,#002C66 70%);opacity:0;visibility:hidden;transform:scale(1.04);transition:opacity .4s var(--ease),transform .4s var(--ease),visibility .4s}

.dots.okk i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px rgba(23,166,115,.7)}
.dots.wait i.f{animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}

.keys{display:grid;grid-template-columns:repeat(3,min(76px,21vw));gap:min(16px,3.6vh) min(26px,6vw)}
.keys button{width:100%;aspect-ratio:1;max-height:9.5vh;max-width:9.5vh;justify-self:center;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:28px;font-weight:300;transition:background .2s,transform .15s;display:grid;place-items:center;padding:0}
.keys button:active{background:rgba(209,64,41,.55);transform:scale(.92)}
.keys button.blank{visibility:hidden}
.keys button.del{border:0;background:none}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translate(-50%,20px);background:var(--pri-d);color:#fff;padding:11px 18px;border-radius:16px;font-size:13.5px;z-index:95;opacity:0;pointer-events:none;transition:.4s var(--ease);box-shadow:0 14px 30px -10px rgba(0,44,102,.6);display:flex;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 40px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--acc-d)}
#toast .ic{width:18px;height:18px;color:#FFB4A6;flex:none}

body.lock #toast{bottom:calc(24px + var(--sb))}

.skel{background:linear-gradient(90deg,#EDF1F7 25%,#F7F9FC 50%,#EDF1F7 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:359px){.ring-wrap{width:112px;height:112px}.ring-center b{font-size:28px}.stat .val{font-size:21px}.brand span:not(.demo-badge){display:none}}

<body>

<script>
/* =========================================================
   CONFIG — Web App URL ของ Apps Script (ลงท้าย /exec)
   ถ้าเว้นว่างไว้ หน้าเว็บจะทำงานในโหมดตัวอย่าง (DEMO)
   ========================================================= */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwmNOwZQXSEXlk0NwBHiAo_BaJzQ5BD1n83bL320JBAon-y8XEAJTBFWqdqc22VW1F9/exec',
  CACHE_KEY: 'mealjournal.cache.v2'
};
const DEMO = !CONFIG.API_URL || /[?&]demo\b/.test(location.search);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const num = v => { if (v === '' || v === null || v === undefined) return null; const n = parseFloat(v); return isFinite(n) ? n : null; };
const fmt = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (v, d = 1) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const thDate = (s, o = { day: 'numeric', month: 'short' }) => parseD(s).toLocaleDateString('th-TH', o);
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const wdName = s => WD[parseD(s).getDay()];
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const sess = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

/* ---------- icons ---------- */
const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  meal: '<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.4 0-3.6 3-3.6 7 0 2.2 1.2 3 3.6 3"/>',
  body: '<path d="M12 2.5a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4zM5 9.5l7 1.5 7-1.5M12 11v4.5M12 15.5 9 21.5M12 15.5l3 6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  lock: '<rect x="4.5" y="10.5" width="15" height="10.5" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  unlock: '<rect x="4.5" y="10.5" width="15" height="10.5" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.8"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M21 6H9l-6 6 6 6h12zM13 10l4 4M17 10l-4 4"/>',
  ruler: '<path d="M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.5L20 16M20 20v-4h-4"/>'
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;

const MEAL_TYPES = [
  { k: 'มื้อเช้า', s: 'เช้า', c: '#E8664F', g: ['#F7B7A9', '#E8664F'] },
  { k: 'มื้อกลางวัน', s: 'กลางวัน', c: '#D14029', g: ['#EE8A76', '#B5321E'] },
  { k: 'มื้อเย็น', s: 'เย็น', c: '#00408F', g: ['#4F82C6', '#002C66'] }
];
const MAIN = ['มื้อเช้า', 'มื้อกลางวัน', 'มื้อเย็น'];
const typeOf = k => MEAL_TYPES.find(t => t.k === k) || { k, s: k || 'อื่น ๆ', c: '#8FA7C9', g: ['#D5E0EF', '#8FA7C9'] };
const guessType = t => { const h = +String(t || nowTime()).split(':')[0]; return h < 11 ? 'มื้อเช้า' : h < 16 ? 'มื้อกลางวัน' : 'มื้อเย็น'; };
const METRICS = [
  { k: 'weight', th: 'น้ำหนัก', u: 'กก.' },
  { k: 'waist', th: 'รอบเอว', u: 'ซม.' },
  { k: 'hip', th: 'สะโพก', u: 'ซม.' },
  { k: 'arm', th: 'ต้นแขน', u: 'ซม.' },
  { k: 'thigh', th: 'ต้นขา', u: 'ซม.' }
];
const POSES = [{ k: 'front', th: 'ด้านหน้า' }, { k: 'side', th: 'ด้านข้าง' }, { k: 'back', th: 'ด้านหลัง' }];

/* ---------- state ---------- */
const S = { profile: {}, body: [], meals: [], unlocked: false, pin: null, page: 'home', selDate: today(), metric: 'weight', pose: 'front', beforeId: null, loaded: false };

/* ---------- API ---------- */
async function apiGet() {
  if (DEMO) return { ok: true, data: demoStore() };
  const r = await fetch(CONFIG.API_URL + '?action=all&t=' + Date.now(), { redirect: 'follow' });
  return r.json();
}
async function apiPost(payload) {
  if (DEMO) return demoPost(payload);
  const r = await fetch(CONFIG.API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return r.json();
}

/* ---------- DEMO data ---------- */
let _demo = null;
function demoStore() {
  if (_demo) return _demo;
  const body = [], meals = [], t = today();
  for (let i = 7; i >= 0; i--) {
    const k = 7 - i;
    body.push({ id: 'b' + i, date: addDays(t, -i * 7), weight: +(68.6 - k * 0.45).toFixed(1), waist: +(83 - k * 0.6).toFixed(1), hip: +(99 - k * 0.35).toFixed(1), arm: +(29.6 - k * 0.15).toFixed(1), thigh: +(56.4 - k * 0.3).toFixed(1), note: '', createdAt: '' });
  }
  const pool = [
    ['มื้อเช้า', '07:50', 'กรีกโยเกิร์ต กราโนล่า เบอร์รี่'],
    ['มื้อเช้า', '08:30', 'ข้าวต้มปลา'],
    ['มื้อกลางวัน', '12:20', 'ข้าวกล้องอกไก่ย่าง สลัดผัก'],
    ['มื้อเย็น', '18:30', 'ผัดผักรวม ไข่ต้ม'],

function applyData(d) {

}
function upsertLocal(arr, item) { const i = arr.findIndex(x => x.id === item.id); i > -1 ? arr.splice(i, 1, item) : arr.push(item); }
function cacheNow() { if (!DEMO) store.set(CONFIG.CACHE_KEY, { profile: S.profile, body: S.body, meals: S.meals }); }
const sortedBody = () => [...S.body].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.createdAt).localeCompare(String(b.createdAt)));
const mealsOn = d => S.meals.filter(m => m.date === d).sort((a, b) => String(a.time).localeCompare(String(b.time)));
const seriesOf = k => sortedBody().filter(r => num(r[k]) !== null).map(r => ({ date: r.date, v: num(r[k]), id: r.id }));
const poseCount = r => POSES.filter(p => r[p.k + 'Url']).length;
function streak() {
  const has = new Set(S.meals.map(m => m.date));
  let d = today(); if (!has.has(d)) d = addDays(d, -1);
  let n = 0; while (has.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function calc() {
  const p = S.profile, h = num(p.height), sex = p.sex;
  const last = k => { const s = seriesOf(k); return s.length ? s[s.length - 1].v : null; };
  const w = last('weight'), waist = last('waist'), hip = last('hip');
  const r = { w, waist, hip, h, sex };
  r.bmi = w && h ? w / ((h / 100) ** 2) : null;
  r.whr = waist && hip ? waist / hip : null;
  r.whtr = waist && h ? waist / h : null;
  r.rfm = waist && h && sex ? (sex === 'male' ? 64 : 76) - 20 * (h / waist) : null;
  const ws = seriesOf('weight');
  r.wTotal = ws.length > 1 ? ws[ws.length - 1].v - ws[0].v : null;
  r.wFirst = ws.length ? ws[0] : null;
  return r;
}
function bmiLabel(b) { if (b == null) return null; if (b < 18.5) return ['น้ำหนักน้อย', 'warn']; if (b < 23) return ['สมส่วน', 'good']; if (b < 25) return ['ท้วม', 'warn']; if (b < 30) return ['อ้วน', 'bad']; return ['อ้วนมาก', 'bad']; }
function whrLabel(v, sex) { if (v == null) return null; const lim = sex === 'male' ? 0.9 : 0.85; return v <= lim ? ['ความเสี่ยงต่ำ', 'good'] : ['ความเสี่ยงสูง', 'bad']; }
function whtrLabel(v) { if (v == null) return null; return v < 0.5 ? ['อยู่ในเกณฑ์ดี', 'good'] : v < 0.6 ? ['ควรระวัง', 'warn'] : ['ความเสี่ยงสูง', 'bad']; }
function rfmLabel(v, sex) { if (v == null) return null; const [a, b] = sex === 'male' ? [25, 30] : [32, 38]; return v < a ? ['ปกติ', 'good'] : v < b ? ['ค่อนข้างสูง', 'warn'] : ['สูง', 'bad']; }

function animateCounts(root) {

    const to = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0;
    if (!isFinite(to)) { el.textContent = '—'; return; }
    const t0 = performance.now(), dur = 900;
    const step = t => { const k = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e, dec); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ---------- Image ---------- */
function compressImage(file, max = 1280, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปนี้ไม่ได้ ลองเลือกรูปอื่น')); };
    img.src = url;
  });
}

        <input type="file" id="poseFile" accept="image/*" hidden></div>
      <div class="field"><label>วันที่วัด</label><input class="inp" type="date" name="date" value="${esc(r.date || today())}" max="${today()}"></div>
      <div class="field"><label>น้ำหนัก</label><div class="unit"><input class="inp" name="weight" inputmode="decimal" placeholder="${last.weight ? 'ครั้งก่อน ' + last.weight : '0.0'}" value="${esc(r.weight ?? '')}"><em>กก.</em></div></div>
      <div class="grid2">${METRICS.slice(1).map(m => `<div class="field"><label>${m.th}</label><div class="unit"><input class="inp" name="${m.k}" inputmode="decimal" placeholder="${last[m.k] ? 'ก่อน ' + last[m.k] : '0.0'}" value="${esc(r[m.k] ?? '')}"><em>ซม.</em></div></div>`).join('')}</div>
      <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><textarea class="inp" name="note" maxlength="300" rows="2" placeholder="เช่น วัดตอนเช้าก่อนอาหาร">${esc(r.note || '')}</textarea></div>
      <button class="btn btn-primary btn-block" type="submit" id="bSave">${icon('check')}${isEdit ? 'บันทึกการแก้ไข' : 'บันทึกสัดส่วน'}</button>
    </form>`, root => {
    const f = $('#bodyF', root), fi = $('#poseFile', root);
    let target = null;
    $$('.pose', root).forEach(slot => {
      slot.addEventListener('click', e => { if (e.target.closest('.prm')) return; target = slot; fi.value = ''; fi.click(); });
      $('.prm', slot).addEventListener('click', e => {
        e.stopPropagation(); const k = slot.dataset.pose;
        delete photos[k]; if (r[k + 'Url']) removes.add(k);
        const im = $('img', slot); if (im) im.remove(); slot.classList.remove('has');
      });
    });
    fi.addEventListener('change', async () => {
      const file = fi.files[0], slot = target; if (!file || !slot) return;
      try {
        const d = await compressImage(file, 1080, 0.8), k = slot.dataset.pose;
        photos[k] = d; removes.delete(k);
        let im = $('img', slot); if (!im) { im = document.createElement('img'); im.alt = ''; slot.prepend(im); }
        im.src = d; slot.classList.add('has');
      } catch (err) { toast(err.message, 'err'); }
    });
    // decimal comma -> dot (some Android keyboards)
    $$('input[inputmode=decimal]', f).forEach(i => i.addEventListener('input', () => { if (i.value.includes(',')) i.value = i.value.replace(',', '.'); }));
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(f));
      const hasPhoto = Object.keys(photos).length || POSES.some(p => r[p.k + 'Url'] && !removes.has(p.k));
      if (!METRICS.some(m => num(fd[m.k]) !== null) && !hasPhoto) { toast('กรอกอย่างน้อย 1 ค่า หรือใส่รูป', 'err'); return; }
      const bad = METRICS.find(m => fd[m.k] !== '' && num(fd[m.k]) === null);
      if (bad) { toast(bad.th + ' ต้องเป็นตัวเลข', 'err'); return; }
      if (!fd.date) fd.date = today();
      const data = { id: r.id, ...fd };
      const btn = $('#bSave', root), n = Object.keys(photos).length;
      setBtnLoading(btn, true, n ? `กำลังอัปโหลด ${n} รูป…` : 'กำลังบันทึก…');
      try {
        const res = await apiPost({ action: 'saveBody', pin: S.pin, data, photos, removePhotos: [...removes] }); if (!res.ok) throw res;
        upsertLocal(S.body, res.item); cacheNow(); closeSheet(); renderAll(); toast('บันทึกสัดส่วนแล้ว');
      } catch (err) { setBtnLoading(btn, false); handleErr(err); }
    });
  });
}

/* ---------- Profile form ---------- */
function profileForm() {
  const p = S.profile;
  openSheet(sheetHead('แก้ไขโปรไฟล์') + `
    <form id="profF" autocomplete="off" novalidate>
      <div class="field"><label>ชื่อเล่น</label><input class="inp" name="name" maxlength="40" value="${esc(p.name || '')}" placeholder="ชื่อที่ให้แสดง"></div>
      <div class="field"><span class="flabel">เพศ (ใช้คำนวณ %ไขมัน)</span><div class="seg"><input type="radio" name="sex" id="sxf" value="female" ${p.sex !== 'male' ? 'checked' : ''}><label for="sxf">หญิง</label><input type="radio" name="sex" id="sxm" value="male" ${p.sex === 'male' ? 'checked' : ''}><label for="sxm">ชาย</label></div></div>
      <div class="grid2"><div class="field"><label>ส่วนสูง</label><div class="unit"><input class="inp" name="height" inputmode="decimal" value="${esc(p.height ?? '')}" placeholder="0"><em>ซม.</em></div></div><div class="field"><label>น้ำหนักเป้าหมาย</label><div class="unit"><input class="inp" name="targetWeight" inputmode="decimal" value="${esc(p.targetWeight ?? '')}" placeholder="—"><em>กก.</em></div></div></div>
      <button class="btn btn-primary btn-block" type="submit" id="pSave" style="margin-top:4px">${icon('check')}บันทึกโปรไฟล์</button>
    </form>`, root => {
    const f = $('#profF', root);
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(f));
      const btn = $('#pSave', root); setBtnLoading(btn, true);
      try {
        const res = await apiPost({ action: 'saveProfile', pin: S.pin, data }); if (!res.ok) throw res;
        S.profile = res.item; cacheNow(); closeSheet(); renderAll(); toast('บันทึกโปรไฟล์แล้ว');
      } catch (err) { setBtnLoading(btn, false); handleErr(err); }
    });
  });
}

/* ---------- PIN ---------- */
let pinBuf = '', pinCb = null, pinBusy = false;
function drawDots() { $$('#dots i').forEach((d, i) => d.classList.toggle('f', i < pinBuf.length)); }
function openPin(cb) {
  pinCb = cb || null; pinBuf = ''; drawDots();
  $('#dots').className = 'dots'; const m = $('#pinMsg'); m.className = '';
  m.textContent = DEMO ? 'โหมดตัวอย่าง: ใส่ตัวเลข 6 หลักใดก็ได้' : 'ไม่ใส่ PIN จะดูข้อมูลได้อย่างเดียว';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#pin').classList.add('show');
}
function closePin() { $('#pin').classList.remove('show'); pinCb = null; pinBuf = ''; }
async function pinPress(k) {
  if (pinBusy) return;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 6) pinBuf += k;
  drawDots(); try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
  if (pinBuf.length < 6) return;
  pinBusy = true; const dots = $('#dots'), msg = $('#pinMsg');
  dots.className = 'dots wait'; msg.className = ''; msg.textContent = 'กำลังตรวจสอบ…';
  let res; try { res = await apiPost({ action: 'verify', pin: pinBuf }); } catch (e) { res = { ok: false, error: 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง' }; }
  if (res.ok) {
    S.unlocked = true; S.pin = pinBuf; sess.set('mj.pin', pinBuf);
    dots.className = 'dots okk'; msg.textContent = 'ปลดล็อกแล้ว';
    const cb = pinCb;
    setTimeout(() => { closePin(); renderAll(); if (cb) cb(); else toast('โหมดแก้ไขเปิดแล้ว'); pinBusy = false; }, 450);
    return;
  }
  dots.className = 'dots'; void dots.offsetWidth; dots.classList.add('shake');
  msg.className = 'err'; msg.textContent = res.error || 'PIN ไม่ถูกต้อง';
  try { navigator.vibrate && navigator.vibrate([40, 60, 40]); } catch (e) {}
  pinBuf = ''; setTimeout(drawDots, 300);
  pinBusy = false;
}
function lockNow() { S.unlocked = false; S.pin = null; sess.set('mj.pin', null); renderAll(); }

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const lb = t.closest('[data-lb]'); if (lb && !t.closest('form')) { openLb(lb.dataset.lb); return; }
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (t.closest('[data-close]')) { closeSheet(); return; }
  const a = t.closest('[data-add]'); if (a) { const k = a.dataset.add; requireUnlock(() => k === 'meal' ? mealForm() : bodyForm()); return; }
  const m = t.closest('[data-meal]'); if (m) { mealDetail(m.dataset.meal); return; }
  const b = t.closest('[data-body]'); if (b) { bodyDetail(b.dataset.body); return; }
  const d = t.closest('[data-date]'); if (d) { S.selDate = d.dataset.date; renderMeals(); return; }
  const mt = t.closest('[data-metric]'); if (mt) { S.metric = mt.dataset.metric; $$('#mchips .chip').forEach(c => c.classList.toggle('on', c === mt)); drawBodyChart(); return; }
  const pt = t.closest('[data-pose-tab]'); if (pt) { S.pose = pt.dataset.poseTab; S.beforeId = null; renderCompare(); return; }
  if (t.closest('[data-edit-profile]')) { requireUnlock(profileForm); return; }
  if (t.closest('#refreshBtn')) { const btn = t.closest('#refreshBtn'); setBtnLoading(btn, true, 'กำลังโหลด…'); load(true).then(ok => { if (ok) toast('อัปเดตข้อมูลล่าสุดแล้ว'); }); return; }
  if (t.closest('#lockBtn')) { S.unlocked ? (lockNow(), toast('ล็อกแล้ว — ดูได้อย่างเดียว')) : openPin(); return; }
});
$('#overlay').addEventListener('click', () => closeSheet());
$('#lb').addEventListener('click', closeLb);
$('#fab').addEventListener('click', () => requireUnlock(chooseAdd));
$('#modeBtn').addEventListener('click', () => S.unlocked ? (lockNow(), toast('ล็อกแล้ว — ดูได้อย่างเดียว')) : openPin());
$('#pinClose').addEventListener('click', closePin);
document.addEventListener('keydown', e => {
  if ($('#lb').classList.contains('show')) { if (e.key === 'Escape') closeLb(); return; }
  if (!$('#pin').classList.contains('show')) { if (e.key === 'Escape') closeSheet(); return; }
  if (/^\d$/.test(e.key)) pinPress(e.key); else if (e.key === 'Backspace') pinPress('del'); else if (e.key === 'Escape') closePin();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.loaded && !sheetOpen && !DEMO) load(true); });

/* ---------- Static UI ---------- */
function buildStatic() {
  $('#brandMark').innerHTML = icon('meal');
  $$('.nav .tab').forEach(b => { const [ic, lb] = NAV[b.dataset.go]; b.innerHTML = icon(ic) + '<span>' + lb + '</span>'; });
  $('#fab').innerHTML = icon('plus');
  $('#pinClose').innerHTML = icon('x');
  $('#lb .xbtn').innerHTML = icon('x');
  $('#pinLock').innerHTML = icon('lock');
  $('#keys').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k === '' ? '<button class="blank" tabindex="-1" aria-hidden="true"></button>' : k === 'del' ? `<button class="del" data-k="del" aria-label="ลบ">${icon('back')}</button>` : `<button data-k="${k}">${k}</button>`).join('');
  $('#keys').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) pinPress(b.dataset.k); });
}
function skeleton() {
  $('#page-home').innerHTML = `<div class="skel" style="height:168px;margin-bottom:14px"></div><div class="skel" style="height:150px;margin-bottom:14px"></div><div class="stats">${'<div class="skel" style="height:100px"></div>'.repeat(4)}</div>`;
}

/* ---------- Load ---------- */
function hideSplash() { $('#splash').classList.add('hide'); }
async function load(quiet) {
  const cached = !DEMO && !S.loaded ? store.get(CONFIG.CACHE_KEY) : null;
  if (cached) { applyData(cached); renderAll(); hideSplash(); }
  let ok = true;
  try {
    const res = await apiGet();
    if (!res || !res.ok) throw new Error((res && res.error) || 'โหลดข้อมูลไม่สำเร็จ');
    applyData(res.data); S.loaded = true; cacheNow();
    if (!sheetOpen) renderAll();
  } catch (err) {
    ok = false;
    toast('โหลดข้อมูลไม่สำเร็จ: ' + (/Failed to fetch|Load failed/i.test(err.message) ? 'ตรวจสอบอินเทอร์เน็ต' : err.message), 'err');
    if (!cached && !quiet) renderAll();
    const rb = $('#refreshBtn'); if (rb) setBtnLoading(rb, false);
  }
  hideSplash();
  return ok;
}

buildStatic();
const savedPin = sess.get('mj.pin'); if (savedPin) { S.pin = savedPin; S.unlocked = true; }
renderHero(); skeleton();
load();
</script>
</body>
