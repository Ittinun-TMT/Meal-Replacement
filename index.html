<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meal Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --navy:#0B1F3A;--navy2:#13294B;--navy3:#1F3B68;--navy-soft:#EEF2F8;
  --orange:#FF7A1A;--orange2:#FFA05C;--orange3:#F05A0A;--orange-soft:#FFF2E8;
  --bg:#F4F6FA;--card:#FFFFFF;--ink:#0B1F3A;--ink2:#3B4A63;--muted:#8792A6;--line:#E8ECF2;
  --ok:#17A673;--bad:#E5484D;
  --r:22px;--shadow:0 14px 34px -16px rgba(11,31,58,.22),0 2px 6px rgba(11,31,58,.04);
  --ease:cubic-bezier(.2,.9,.25,1);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit',system-ui,-apple-system,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:500}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:520px;margin:0 auto;position:relative;min-height:100vh;padding-bottom:calc(120px + var(--sb))}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 80% 0%,#1F3B68 0%,#0B1F3A 60%);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
.splash-in{text-align:center;color:#fff}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--orange2),var(--orange) 55%,var(--orange3));display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 18px 40px -10px rgba(255,122,26,.65);animation:pulse 1.6s ease-in-out infinite}
.logo .ic{width:36px;height:36px;stroke-width:1.6;color:#fff}
.splash-in h1{margin:0;font-weight:500;letter-spacing:.28em;font-size:15px}
.splash-in p{margin:6px 0 0;font-size:12px;opacity:.55;letter-spacing:.1em}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(16px + var(--st)) 20px 84px;border-radius:0 0 34px 34px;
  background:linear-gradient(160deg,#0B1F3A 0%,#13294B 55%,#1F3B68 100%)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px);pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(42px);opacity:.5;animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:230px;height:230px;background:var(--orange);top:-90px;right:-70px}
.b2{width:200px;height:200px;background:#3D6BB3;bottom:-110px;left:-60px;animation-delay:-5s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-24px,18px) scale(1.08)}66%{transform:translate(16px,-12px) scale(.95)}}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.24em;font-weight:500}
.brand .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--orange2),var(--orange3));display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(255,122,26,.6)}
.brand .mark .ic{width:18px;height:18px;color:#fff}
.demo-badge{font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.14);margin-left:2px}
.mode{display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);color:#fff;border-radius:99px;padding:7px 13px 7px 10px;font-size:12px;transition:.3s var(--ease)}
.mode .ic{width:16px;height:16px}
.mode.on{background:linear-gradient(135deg,var(--orange2),var(--orange));border-color:transparent;box-shadow:0 8px 20px -6px rgba(255,122,26,.7)}
.hero-text{position:relative;margin-top:26px}
.hero-text small{display:block;font-size:13px;opacity:.6;letter-spacing:.02em}
.hero-text h1{margin:4px 0 0;font-size:27px;font-weight:500;line-height:1.25}
.hero-text h1 span{color:var(--orange2)}
.hero-text.swap{animation:fadeUp .55s var(--ease)}

/* ---------- Layout ---------- */
.content{margin-top:-60px;padding:0 16px;position:relative;z-index:2}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.reveal{opacity:0;animation:fadeUp .7s var(--ease) forwards;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec-h h3{margin:0;font-size:16px;font-weight:500}
.sec-h a,.link{font-size:12.5px;color:var(--orange);font-weight:400;background:none;border:0;padding:0}
.muted{color:var(--muted)}

/* ---------- Ring card ---------- */
.ring-card{display:flex;gap:16px;align-items:center;padding:20px 18px}
.ring-wrap{position:relative;width:138px;height:138px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring-bg{stroke:var(--navy-soft)}
.ring-fg{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset 1.4s var(--ease)}
.ring-fg.over{stroke:var(--bad)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center small{font-size:11px;color:var(--muted);line-height:1.2}
.ring-center b{font-size:28px;font-weight:600;line-height:1.15;color:var(--navy)}
.ring-side{flex:1;min-width:0}
.remain{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.remain small{font-size:12px;color:var(--muted);width:100%}
.remain b{font-size:24px;font-weight:600;color:var(--orange)}
.remain.over b{color:var(--bad)}
.remain span{font-size:12px;color:var(--muted)}
.mbar{margin-top:9px}
.mbar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.mbar-top span:last-child{color:var(--muted)}
.mbar-track{height:7px;border-radius:9px;background:var(--navy-soft);overflow:hidden}
.mbar-fill{height:100%;width:0;border-radius:9px;transition:width 1.2s var(--ease)}
.mbar-fill.p{background:linear-gradient(90deg,var(--navy3),var(--navy))}
.mbar-fill.c{background:linear-gradient(90deg,var(--orange2),var(--orange))}
.mbar-fill.f{background:linear-gradient(90deg,#C3CDDC,#8A9BB8)}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:15px 15px 14px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:74px;height:74px;border-radius:50%;background:var(--orange-soft);opacity:.7}
.stat.dark{background:linear-gradient(150deg,var(--navy2),var(--navy));color:#fff}
.stat.dark::after{background:rgba(255,122,26,.22)}
.stat .lbl{font-size:12px;color:var(--muted);position:relative;z-index:1}
.stat.dark .lbl{color:rgba(255,255,255,.6)}
.stat .val{font-size:25px;font-weight:600;margin-top:2px;position:relative;z-index:1;line-height:1.25}
.stat .val small{font-size:12px;font-weight:300;color:var(--muted);margin-left:3px}
.stat.dark .val small{color:rgba(255,255,255,.55)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:99px;margin-top:6px;background:var(--navy-soft);color:var(--ink2);position:relative;z-index:1}
.pill.good{background:#E6F6EF;color:var(--ok)}
.pill.warn{background:var(--orange-soft);color:var(--orange3)}
.pill.bad{background:#FDECEC;color:var(--bad)}
.stat.dark .pill{background:rgba(255,255,255,.12);color:#fff}

/* ---------- Banner ---------- */
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--orange-soft),#fff);border:1px solid #FFE0C7}
.banner .ic{color:var(--orange);width:26px;height:26px}
.banner p{margin:0;font-size:13px;flex:1;line-height:1.45}

/* ---------- Meals ---------- */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 152px;scroll-snap-align:start;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left}
.mini .phbox{height:108px}
.mini .mi-b{padding:10px 12px 12px}
.mini h4{margin:4px 0 2px;font-size:13.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .k{font-size:12px;color:var(--muted)}
.mini .k b{color:var(--orange);font-weight:600;font-size:14px}

.phbox{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1,#FFD7B8),var(--c2,#FF9A4D));display:grid;place-items:center}
.phbox>.ic{width:30px;height:30px;color:rgba(255,255,255,.85);stroke-width:1.5}
.phbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .6s,transform 1s var(--ease)}
.phbox img.ok{opacity:1;transform:none}
.phbox img.err{display:none}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:400;color:var(--ink2)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc,var(--orange))}

.datestrip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 54px;height:72px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:.35s var(--ease);scroll-snap-align:center}
.dchip small{font-size:11px;color:var(--muted)}
.dchip b{font-size:19px;font-weight:500}
.dchip i{position:absolute;bottom:8px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.dchip.all{flex-basis:62px}
.dchip.all b{font-size:13px}
.dchip.on{background:linear-gradient(160deg,var(--navy3),var(--navy));color:#fff;transform:translateY(-3px);box-shadow:0 14px 26px -10px rgba(11,31,58,.6)}
.dchip.on small{color:rgba(255,255,255,.6)}
.dchip.on i{background:var(--orange2)}

.daysum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;padding:14px 10px}
.daysum div{border-right:1px solid var(--line)}
.daysum div:last-child{border:0}
.daysum b{display:block;font-size:18px;font-weight:600}
.daysum b.o{color:var(--orange)}
.daysum small{font-size:11px;color:var(--muted)}

.dgroup-h{font-size:13px;color:var(--muted);margin:18px 4px 10px;display:flex;justify-content:space-between}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--line),var(--line) 60%,transparent)}
.mcard{position:relative;display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:10px;margin-bottom:12px;width:100%;border:0;text-align:left;transition:transform .25s var(--ease)}
.mcard:active{transform:scale(.98)}
.mcard::before{content:"";position:absolute;left:-19px;top:22px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--tc,var(--orange))}
.mcard .phbox{width:84px;height:84px;border-radius:15px;flex:none}
.mcard .mc-b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-right:4px}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-top time{font-size:12px;color:var(--muted)}
.mcard h4{margin:4px 0 5px;font-size:15px;font-weight:400;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.macros{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.macros b{color:var(--orange);font-weight:600}
.macros span em{font-style:normal;color:var(--ink2)}

.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:22px;background:var(--orange-soft);display:grid;place-items:center;margin:0 auto 12px}
.empty .eic .ic{color:var(--orange);width:30px;height:30px}
.empty p{margin:0 0 14px;font-size:14px}

/* ---------- Body ---------- */
.mtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mtiles .stat:first-child{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;transition:.3s var(--ease)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chart-box{position:relative;height:210px}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.hrow:last-child{border-bottom:0}
.hdate{width:50px;text-align:center;flex:none;background:var(--navy-soft);border-radius:14px;padding:6px 0}
.hdate b{display:block;font-size:17px;font-weight:600;line-height:1.1}
.hdate small{font-size:10.5px;color:var(--muted)}
.hvals{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;text-align:center}
.hvals span{font-size:13.5px;font-weight:400}
.hvals small{display:block;font-size:10px;color:var(--muted)}

/* ---------- Profile ---------- */
.prof{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:22px;background:linear-gradient(135deg,var(--navy3),var(--navy));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:500;flex:none;position:relative}
.avatar::after{content:"";position:absolute;inset:-4px;border-radius:26px;border:2px solid var(--orange);opacity:.4}
.prof h2{margin:0;font-size:19px;font-weight:500}
.prof p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}
.goal-track{height:10px;border-radius:9px;background:var(--navy-soft);overflow:hidden;margin:10px 0 6px}
.goal-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange2),var(--orange3));border-radius:9px;transition:width 1.4s var(--ease)}
.formula{font-size:12.5px;color:var(--ink2);line-height:1.6;padding:10px 0;border-bottom:1px dashed var(--line)}
.formula:last-child{border:0}
.formula b{color:var(--navy)}

/* ---------- Buttons ---------- */
.btn{position:relative;overflow:hidden;border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:400;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--ease),box-shadow .3s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--orange2),var(--orange) 55%,var(--orange3));color:#fff;box-shadow:0 12px 24px -10px rgba(255,122,26,.8)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:var(--navy-soft);color:var(--navy)}
.btn-danger{background:#FDECEC;color:var(--bad)}
.btn-block{width:100%}
.btn[disabled]{opacity:.7;pointer-events:none}
.btn .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ---------- Nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sb));width:calc(100% - 24px);max-width:496px;height:68px;background:rgba(11,31,58,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:40;box-shadow:0 20px 44px -14px rgba(11,31,58,.6)}
.nav .tab{background:none;border:0;color:rgba(255,255,255,.5);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;position:relative;transition:color .3s}
.nav .tab .ic{transition:transform .4s var(--ease),color .3s}
.nav .tab.active{color:#fff}
.nav .tab.active .ic{color:var(--orange2);transform:translateY(-2px)}
.nav .tab::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--orange);transform:scale(0);transition:transform .35s var(--ease)}
.nav .tab.active::after{transform:scale(1)}
.fab{width:60px;height:60px;border-radius:21px;border:0;margin:-36px auto 0;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--orange2),var(--orange) 50%,var(--orange3));box-shadow:0 14px 28px -8px rgba(255,122,26,.75),0 0 0 6px var(--bg);transition:transform .3s var(--ease)}
.fab:active{transform:scale(.92) rotate(90deg)}
.fab .ic{width:28px;height:28px;stroke-width:2.2}

/* ---------- Sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,16,32,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:93vh;background:#fff;border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);z-index:61;display:flex;flex-direction:column;padding-bottom:var(--sb)}
.sheet:not(.open){visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.sheet-handle{padding:10px 0 6px;display:grid;place-items:center;touch-action:none}
.sheet-handle span{width:44px;height:5px;border-radius:9px;background:#D9DEE7}
.sheet-body{overflow-y:auto;padding:4px 20px 26px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.sheet-title h2{margin:0;font-size:20px;font-weight:500}
.xbtn{width:36px;height:36px;border-radius:12px;border:0;background:var(--navy-soft);display:grid;place-items:center;color:var(--navy)}
.xbtn .ic{width:18px;height:18px}

.choose{display:grid;gap:12px}
.choose button{display:flex;align-items:center;gap:14px;border:0;border-radius:20px;padding:18px;text-align:left;background:var(--navy-soft);transition:transform .2s var(--ease)}
.choose button:active{transform:scale(.97)}
.choose button:first-child{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff}
.choose .cic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange2),var(--orange3));color:#fff;flex:none}
.choose b{display:block;font-size:16px;font-weight:500}
.choose small{font-size:12.5px;opacity:.65}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px 2px}
.inp{width:100%;border:1.5px solid var(--line);background:#FAFBFD;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:300;outline:none;transition:border-color .25s,box-shadow .25s,background .25s;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(255,122,26,.12)}
textarea.inp{resize:none;min-height:70px}

<script>
/* =========================================================
   CONFIG — วาง Web App URL ของ Apps Script (ลงท้าย /exec)
   ถ้าเว้นว่างไว้ หน้าเว็บจะทำงานในโหมดตัวอย่าง (DEMO)
   ========================================================= */
const CONFIG = {
  API_URL: '',
  CACHE_KEY: 'mealjournal.cache.v1'
};
const DEMO = !CONFIG.API_URL;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const num = v => { if (v === '' || v === null || v === undefined) return null; const n = parseFloat(v); return isFinite(n) ? n : null; };
const fmt = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const thDate = (s, o = { day: 'numeric', month: 'short' }) => parseD(s).toLocaleDateString('th-TH', o);
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const sess = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

/* ---------- icons ---------- */
const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  meal: '<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.4 0-3.6 3-3.6 7 0 2.2 1.2 3 3.6 3"/>',
  body: '<path d="M12 2.5a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4zM5 9.5l7 1.5 7-1.5M12 11v4.5M12 15.5 9 21.5M12 15.5l3 6"/>',

  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M21 6H9l-6 6 6 6h12zM13 10l4 4M17 10l-4 4"/>',
  ruler: '<path d="M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.5L20 16M20 20v-4h-4"/>',
  flame: '<path d="M12 21c4 0 7-2.8 7-6.8 0-3.7-2.6-6-4.4-8.7-.4 2.2-1.6 3.4-3 4.2C11.8 7 10.8 4.6 9 3c0 4-4 6.2-4 11.2C5 18.2 8 21 12 21z"/>'
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24">${IC[n] || ''}</svg>`;

const MEAL_TYPES = [
  { k: 'มื้อเช้า', c: '#FFB547', g: ['#FFE2B3', '#FFB547'] },
  { k: 'มื้อกลางวัน', c: '#FF7A1A', g: ['#FFC9A1', '#FF7A1A'] },
  { k: 'มื้อเย็น', c: '#1F3B68', g: ['#5B7BB0', '#13294B'] },
  { k: 'มื้อว่าง', c: '#8A9BB8', g: ['#D6DEEA', '#8A9BB8'] },
  { k: 'Meal Replacement', c: '#F05A0A', g: ['#FF9A4D', '#C8460A'] }
];
const WD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const wdName = s => WD[parseD(s).getDay()];
const typeOf = k => MEAL_TYPES.find(t => t.k === k) || MEAL_TYPES[1];
const guessType = t => { const h = +String(t || nowTime()).split(':')[0]; return h < 11 ? 'มื้อเช้า' : h < 15 ? 'มื้อกลางวัน' : h < 17 ? 'มื้อว่าง' : 'มื้อเย็น'; };
const METRICS = [
  { k: 'weight', th: 'น้ำหนัก', u: 'กก.' },
  { k: 'waist', th: 'รอบเอว', u: 'ซม.' },
  { k: 'hip', th: 'สะโพก', u: 'ซม.' },
  { k: 'arm', th: 'ต้นแขน', u: 'ซม.' },
  { k: 'thigh', th: 'ต้นขา', u: 'ซม.' }
];
const ACTIVITY = [
  [1.2, 'นั่งทำงาน ไม่ค่อยออกกำลังกาย'],
  [1.375, 'ออกกำลังเบา 1–3 วัน/สัปดาห์'],
  [1.55, 'ออกกำลังปานกลาง 3–5 วัน/สัปดาห์'],
  [1.725, 'ออกกำลังหนัก 6–7 วัน/สัปดาห์'],
  [1.9, 'หนักมาก / ใช้แรงงาน']
];

/* ---------- state ---------- */
const S = { profile: {}, body: [], meals: [], unlocked: false, pin: null, page: 'home', selDate: today(), metric: 'weight', loaded: false };

/* ---------- API ---------- */
async function apiGet() {
  if (DEMO) return { ok: true, data: demoStore() };
  const r = await fetch(CONFIG.API_URL + '?action=all&t=' + Date.now());
  return r.json();
}
async function apiPost(payload) {
  if (DEMO) return demoPost(payload);
  const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return r.json();
}

/* ---------- DEMO data ---------- */
let _demo = null;
function demoStore() {
  if (_demo) return _demo;
  const body = [], meals = [], t = today();
  for (let i = 7; i >= 0; i--) {
    const k = 7 - i;
    body.push({ id: 'b' + i, date: addDays(t, -i * 7), weight: +(68.6 - k * 0.45).toFixed(1), waist: +(83 - k * 0.6).toFixed(1), hip: +(99 - k * 0.35).toFixed(1), arm: +(29.6 - k * 0.15).toFixed(1), thigh: +(56.4 - k * 0.3).toFixed(1), note: '', createdAt: '' });
  }
  const pool = [
    ['มื้อเช้า', '07:50', 'กรีกโยเกิร์ต กราโนล่า เบอร์รี่', 380, 22, 48, 10],
    ['Meal Replacement', '08:30', 'เชคโปรตีนวานิลลา', 220, 25, 15, 6],
    ['มื้อกลางวัน', '12:20', 'ข้าวกล้องอกไก่ย่าง สลัดผัก', 540, 42, 55, 14],
    ['มื้อว่าง', '15:30', 'อัลมอนด์อบ 1 กำมือ', 170, 6, 6, 15],
    ['มื้อเย็น', '18:45', 'แซลมอนย่าง ผักโขม มันหวาน', 610, 38, 42, 28],
    ['มื้อกลางวัน', '12:10', 'ส้มตำไทย ไก่ย่าง ข้าวเหนียว', 650, 35, 80, 18],
    ['มื้อเย็น', '19:00', 'ต้มยำกุ้งน้ำใส ข้าวสวย', 480, 30, 60, 10]
  ];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i);
    const pick = i === 0 ? [1, 2, 3] : [i % 2 ? 0 : 1, i % 3 ? 2 : 5, 3, i % 2 ? 4 : 6];
    pick.forEach((p, j) => { const m = pool[p]; meals.push({ id: 'm' + i + j, date: d, time: m[1], type: m[0], name: m[2], kcal: m[3], protein: m[4], carb: m[5], fat: m[6], photoUrl: '', photoId: '', note: '' }); });
  }
  _demo = { body, meals, profile: { name: 'ผู้ใช้ทดลอง', sex: 'female', age: 32, height: 162, activity: 1.375, targetWeight: 60, targetKcal: '' } };
  return _demo;
}
async function demoPost(p) {
  await new Promise(r => setTimeout(r, 500));
  const d = demoStore();
  if (p.action === 'verify') return /^\d{6}$/.test(p.pin) ? { ok: true } : { ok: false, code: 'BAD_PIN', error: 'PIN ไม่ถูกต้อง' };
  const save = (arr, data, extra) => { const o = Object.assign({}, arr.find(x => x.id === data.id) || {}, data, extra || {}); if (!o.id) o.id = 'x' + Date.now(); return o; };
  if (p.action === 'saveMeal') return { ok: true, item: save(d.meals, p.data, p.photoData ? { photoUrl: p.photoData } : p.removePhoto ? { photoUrl: '' } : null) };
  if (p.action === 'saveBody') return { ok: true, item: save(d.body, p.data) };
  if (p.action === 'saveProfile') return { ok: true, item: p.data };
  return { ok: true, item: { id: p.id } };
}

/* ---------- data ---------- */
function applyData(d) { S.profile = d.profile || {}; S.body = d.body || []; S.meals = d.meals || []; }
function upsertLocal(arr, item) { const i = arr.findIndex(x => x.id === item.id); i > -1 ? arr.splice(i, 1, item) : arr.push(item); }
function cacheNow() { if (!DEMO) store.set(CONFIG.CACHE_KEY, { profile: S.profile, body: S.body, meals: S.meals }); }
const sortedBody = () => [...S.body].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.createdAt).localeCompare(String(b.createdAt)));
const mealsOn = d => S.meals.filter(m => m.date === d).sort((a, b) => String(a.time).localeCompare(String(b.time)));
const sumMeals = arr => arr.reduce((s, m) => ({ kcal: s.kcal + (num(m.kcal) || 0), protein: s.protein + (num(m.protein) || 0), carb: s.carb + (num(m.carb) || 0), fat: s.fat + (num(m.fat) || 0) }), { kcal: 0, protein: 0, carb: 0, fat: 0 });
function seriesOf(k) { return sortedBody().filter(r => num(r[k]) !== null).map(r => ({ date: r.date, v: num(r[k]) })); }

function calc() {
  const p = S.profile, h = num(p.height), age = num(p.age), sex = p.sex;
  const last = k => { const s = seriesOf(k); return s.length ? s[s.length - 1].v : null; };
  const w = last('weight'), waist = last('waist'), hip = last('hip');
  const r = { w, waist, hip, h, sex };
  r.bmi = w && h ? w / ((h / 100) ** 2) : null;
  r.whr = waist && hip ? waist / hip : null;
  r.whtr = waist && h ? waist / h : null;
  r.rfm = waist && h && sex ? (sex === 'male' ? 64 : 76) - 20 * (h / waist) : null;
  r.bmr = w && h && age && sex ? 10 * w + 6.25 * h - 5 * age + (sex === 'male' ? 5 : -161) : null;
  r.tdee = r.bmr ? r.bmr * (num(p.activity) || 1.2) : null;
  const tw = num(p.targetWeight);
  r.auto = r.tdee ? Math.round(r.tdee - (tw && w && tw < w ? 500 : tw && w && tw > w ? -300 : 0)) : null;
  r.target = num(p.targetKcal) || r.auto || 1800;
  r.macroT = { p: r.target * 0.3 / 4, c: r.target * 0.4 / 4, f: r.target * 0.3 / 9 };
  return r;
}
function bmiLabel(b) { if (b == null) return ['', '']; if (b < 18.5) return ['น้ำหนักน้อย', 'warn']; if (b < 23) return ['สมส่วน', 'good']; if (b < 25) return ['ท้วม', 'warn']; if (b < 30) return ['อ้วน', 'bad']; return ['อ้วนมาก', 'bad']; }
function whrLabel(v, sex) { if (v == null) return ['', '']; const lim = sex === 'male' ? 0.9 : 0.85; return v <= lim ? ['ความเสี่ยงต่ำ', 'good'] : ['ความเสี่ยงสูง', 'bad']; }
function whtrLabel(v) { if (v == null) return ['', '']; return v < 0.5 ? ['อยู่ในเกณฑ์ดี', 'good'] : v < 0.6 ? ['ควรระวัง', 'warn'] : ['ความเสี่ยงสูง', 'bad']; }
function rfmLabel(v, sex) { if (v == null) return ['', '']; const [a, b] = sex === 'male' ? [25, 30] : [32, 38]; return v < a ? ['ปกติ', 'good'] : v < b ? ['ค่อนข้างสูง', 'warn'] : ['สูง', 'bad']; }

/* ---------- UI primitives ---------- */
function animateCounts(root) {
  $$('[data-count]', root).forEach(el => {
    const to = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0;
    if (!isFinite(to)) { el.textContent = '—'; return; }
    const t0 = performance.now(), dur = 1000;
    const step = t => { const k = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e, dec); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
let toastT;
function toast(msg, type = '') {
  const t = $('#toast'); t.className = type; t.innerHTML = icon(type === 'err' ? 'info' : 'check') + '<span>' + esc(msg) + '</span>';
  afterPaint(() => t.classList.add('show')); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function photoBox(m, cls = '') {
  const t = typeOf(m.type);
  const img = m.photoUrl ? `<img src="${esc(m.photoUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.classList.add('ok')" onerror="this.classList.add('err')">` : '';
  return `<div class="phbox ${cls}" style="--c1:${t.g[0]};--c2:${t.g[1]}">${icon('meal')}${img}</div>`;
}
function setBtnLoading(btn, on, label) {
  if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>' + (label || 'กำลังบันทึก…'); btn.disabled = true; }
  else { btn.innerHTML = btn.dataset.label || btn.innerHTML; btn.disabled = false; }
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.fab,.choose button'); if (!b) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), sp = document.createElement('span');
  sp.className = 'ripple'; sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(sp); setTimeout(() => sp.remove(), 650);
});

function macroBar(lbl, v, t, cls) {

}
function statTile(lbl, v, dec, unit, label, cls = '', d = 0) {
  const val = v == null ? '—' : `<span data-count="${v}" data-dec="${dec}">0</span>`;
  return `<div class="stat ${cls} reveal" style="--d:${d}"><div class="lbl">${lbl}</div><div class="val">${val}${v == null ? '' : `<small>${unit}</small>`}</div>${label && label[0] ? `<span class="pill ${label[1]}">${label[0]}</span>` : ''}</div>`;
}

        ${macroBar('โปรตีน', sum.protein, c.macroT.p, 'p')}${macroBar('คาร์บ', sum.carb, c.macroT.c, 'c')}${macroBar('ไขมัน', sum.fat, c.macroT.f, 'f')}

/* ---------- Body ---------- */
function renderBody() {

    const pill = d == null ? '' : `<span class="pill ${d <= 0 ? 'good' : 'warn'}">${d <= 0 ? '▼' : '▲'} ${fmt(Math.abs(d), 1)} จากครั้งก่อน</span>`;

function compressImage(file, max = 1280, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}

/* ---------- PIN ---------- */
let pinBuf = '', pinCb = null, pinBusy = false;
function drawDots() { $$('#dots i').forEach((d, i) => d.classList.toggle('f', i < pinBuf.length)); }
function openPin(cb) {
  pinCb = cb || null; pinBuf = ''; drawDots();
  $('#dots').className = 'dots'; const m = $('#pinMsg'); m.className = '';
  m.textContent = DEMO ? 'โหมดตัวอย่าง: ใส่ตัวเลข 6 หลักใดก็ได้' : 'ไม่ใส่ PIN จะดูข้อมูลได้อย่างเดียว';
  $('#pin').classList.add('show');
}
function closePin() { $('#pin').classList.remove('show'); pinCb = null; }
async function pinPress(k) {
  if (pinBusy) return;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 6) pinBuf += k;
  drawDots(); if (navigator.vibrate) navigator.vibrate(8);
  if (pinBuf.length < 6) return;
  pinBusy = true; const dots = $('#dots'), msg = $('#pinMsg');
  dots.className = 'dots wait'; msg.className = ''; msg.textContent = 'กำลังตรวจสอบ…';
  let res; try { res = await apiPost({ action: 'verify', pin: pinBuf }); } catch (e) { res = { ok: false, error: 'เชื่อมต่อไม่ได้' }; }
  if (res.ok) {
    S.unlocked = true; S.pin = pinBuf; sess.set('mj.pin', pinBuf);
    dots.className = 'dots okk'; msg.textContent = 'ปลดล็อกแล้ว';
    const cb = pinCb;
    setTimeout(() => { closePin(); renderAll(); toast('โหมดแก้ไขเปิดแล้ว'); if (cb) cb(); }, 450);
  } else {
    dots.className = 'dots'; void dots.offsetWidth; dots.classList.add('shake');
    msg.className = 'err'; msg.textContent = res.error || 'PIN ไม่ถูกต้อง';
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    pinBuf = ''; setTimeout(drawDots, 300);
  }
  pinBusy = false;
}
function lockNow() { S.unlocked = false; S.pin = null; sess.set('mj.pin', null); renderAll(); }

  $('#brandMark').innerHTML = icon('meal');
  $$('.nav .tab').forEach(b => { const [ic, lb] = NAV[b.dataset.go]; b.innerHTML = icon(ic) + '<span>' + lb + '</span>'; });
  $('#fab').innerHTML = icon('plus');
  $('#pinClose').innerHTML = icon('x');
  $('#pinLock').innerHTML = icon('lock');
  $('#keys').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k === '' ? '<button class="blank" tabindex="-1"></button>' : k === 'del' ? `<button class="del" data-k="del" aria-label="ลบ">${icon('back')}</button>` : `<button data-k="${k}">${k}</button>`).join('');
  $('#keys').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) pinPress(b.dataset.k); });
}
function skeleton() {
  $('#page-home').innerHTML = `<div class="skel" style="height:178px;margin-bottom:14px"></div><div class="stats">${'<div class="skel" style="height:104px"></div>'.repeat(4)}</div>`;
}

/* ---------- Load ---------- */
function hideSplash() { $('#splash').classList.add('hide'); }
async function load() {
  const cached = !DEMO && !S.loaded ? store.get(CONFIG.CACHE_KEY) : null;
  if (cached) { applyData(cached); renderAll(); hideSplash(); }
  try {
    const res = await apiGet();
    if (!res || !res.ok) throw new Error((res && res.error) || 'โหลดข้อมูลไม่สำเร็จ');
    applyData(res.data); S.loaded = true; cacheNow(); renderAll();
  } catch (err) {
    toast('เชื่อมต่อ Google Sheet ไม่ได้: ' + err.message, 'err');
    if (!cached) renderAll();
  }
  hideSplash();
}

buildStatic();
const savedPin = sess.get('mj.pin'); if (savedPin) { S.pin = savedPin; S.unlocked = true; }
renderHero(); skeleton();
setTimeout(load, DEMO ? 650 : 0);
</script>
</body>
</html>
