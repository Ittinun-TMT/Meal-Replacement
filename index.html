<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002C66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Meal Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --pri:#00408F;--pri2:#0A54B0;--pri-d:#002C66;--pri-soft:#EAF1FB;--pri-line:#C9D8EE;
  --acc:#D14029;--acc2:#E8664F;--acc-d:#B5321E;--acc-soft:#FCEEEB;
  --bg:#F5F7FB;--card:#FFFFFF;--ink:#0C2347;--ink2:#3B4A63;--muted:#8792A6;--line:#E7ECF3;
  --ok:#17A673;--ok-soft:#E6F6EF;
  --r:22px;--shadow:0 14px 34px -16px rgba(0,44,102,.22),0 2px 6px rgba(0,44,102,.04);
  --ease:cubic-bezier(.2,.9,.25,1);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit',system-ui,-apple-system,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
b,strong{font-weight:500}
img{-webkit-user-drag:none;user-select:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:520px;margin:0 auto;position:relative;min-height:100vh;padding-bottom:calc(118px + var(--sb))}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 80% 0%,#0A54B0 0%,#002C66 62%);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
.splash-in{text-align:center;color:#fff}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,var(--acc-d));display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 18px 40px -10px rgba(209,64,41,.65);animation:pulse 1.6s ease-in-out infinite}
.logo .ic{width:36px;height:36px;stroke-width:1.6;color:#fff}
.splash-in h1{margin:0;font-weight:500;letter-spacing:.28em;font-size:15px}
.splash-in p{margin:6px 0 0;font-size:12px;opacity:.6;letter-spacing:.06em}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(16px + var(--st)) 20px 84px;border-radius:0 0 34px 34px;background:linear-gradient(160deg,#002C66 0%,#00408F 55%,#0A54B0 100%)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 22px);pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(44px);opacity:.5;animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:220px;height:220px;background:var(--acc);top:-100px;right:-70px}
.b2{width:200px;height:200px;background:#4F9BFF;bottom:-120px;left:-70px;animation-delay:-5s;opacity:.4}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-24px,18px) scale(1.08)}66%{transform:translate(16px,-12px) scale(.95)}}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.2em;font-weight:500;min-width:0;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc2),var(--acc-d));display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(209,64,41,.6);flex:none}
.brand .mark .ic{width:18px;height:18px;color:#fff}
.demo-badge{font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.16)}
.mode{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:99px;padding:7px 12px 7px 10px;font-size:12px;transition:.3s var(--ease);white-space:nowrap;flex:none}
.mode .ic{width:16px;height:16px}
.mode.on{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;box-shadow:0 8px 20px -6px rgba(209,64,41,.7)}
.hero-text{position:relative;margin-top:24px}
.hero-text small{display:block;font-size:13px;opacity:.7}
.hero-text h1{margin:4px 0 0;font-size:26px;font-weight:500;line-height:1.3}
.hero-text h1 span{color:#FFB4A6}
.hero-text.swap{animation:fadeUp .55s var(--ease)}

/* Layout */
.content{margin-top:-60px;padding:0 16px;position:relative;z-index:2}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.reveal{opacity:0;animation:fadeUp .7s var(--ease) forwards;animation-delay:calc(var(--d,0) * 60ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec-h h3{margin:0;font-size:16px;font-weight:500}
.link{font-size:13px;color:var(--acc);font-weight:400;background:none;border:0;padding:4px 0;flex:none}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Today ring */
.ring-card{display:flex;gap:16px;align-items:center;padding:20px 18px}
.ring-wrap{position:relative;width:128px;height:128px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring-bg{stroke:var(--pri-soft)}
.ring-fg{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset 1.4s var(--ease)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center small{font-size:11px;color:var(--muted);line-height:1.2}
.ring-center b{font-size:34px;font-weight:600;line-height:1.1;color:var(--pri)}
.ring-side{flex:1;min-width:0}
.streak{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.streak small{font-size:12px;color:var(--muted);width:100%}
.streak b{font-size:26px;font-weight:600;color:var(--acc);line-height:1.1}
.streak span{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--pri-soft);color:var(--muted);transition:.3s var(--ease);white-space:nowrap}
.chk::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc);opacity:.5}
.chk.on{background:var(--pri);color:#fff}
.chk.on::before{display:none}
.chk .ic{width:13px;height:13px;stroke-width:2.8;color:#FFB4A6}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:15px 14px 14px;position:relative;overflow:hidden;min-width:0}
.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:74px;height:74px;border-radius:50%;background:var(--acc-soft);opacity:.8}
.stat.dark{background:linear-gradient(150deg,var(--pri2),var(--pri-d));color:#fff}
.stat.dark::after{background:rgba(209,64,41,.3)}
.stat .lbl{font-size:12px;color:var(--muted);position:relative;z-index:1}
.stat.dark .lbl{color:rgba(255,255,255,.7)}
.stat .val{font-size:24px;font-weight:600;margin-top:2px;position:relative;z-index:1;line-height:1.25;white-space:nowrap}
.stat .val small{font-size:12px;font-weight:300;color:var(--muted);margin-left:3px}
.stat.dark .val small{color:rgba(255,255,255,.6)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:99px;margin-top:6px;background:var(--pri-soft);color:var(--ink2);position:relative;z-index:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--acc-soft);color:var(--acc-d)}
.pill.bad{background:#FDE3DE;color:var(--acc-d)}
.stat.dark .pill{background:rgba(255,255,255,.14);color:#fff}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;justify-content:center}
.pseg{display:flex;background:var(--pri-soft);border-radius:12px;padding:3px;flex:none}
.pseg button{border:0;background:none;font-size:12.5px;padding:5px 10px;border-radius:9px;color:var(--ink2);transition:background .25s,color .25s;white-space:nowrap}
.pseg button.on{background:#fff;color:var(--pri);box-shadow:0 3px 10px -4px rgba(0,44,102,.3);font-weight:400}
.swapin{animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--d,0) * 45ms - 250ms)}
.card-h{margin:0 0 12px;font-size:15px;font-weight:500}
.hint-p{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.ins-card{padding:14px 16px}
.ins-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.ins-h .ic{width:18px;height:18px;color:var(--acc)}
.ins{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);opacity:0;animation:fadeUp .5s var(--ease) forwards;animation-delay:calc(150ms + var(--i) * 90ms)}
.ins:last-child{border-bottom:0;padding-bottom:2px}
.ins-ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pri-soft);color:var(--pri)}
.ins-ic .ic{width:18px;height:18px}
.ins.good .ins-ic{background:var(--ok-soft);color:var(--ok)}
.ins.warn .ins-ic{background:var(--acc-soft);color:var(--acc)}
.ins p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink2);padding-top:6px;min-width:0;word-break:break-word}
.ins p b{color:var(--ink)}
.chips.ana-tabs{margin:2px -16px 10px;padding:4px 16px 8px}
.ana-tabs .chip{box-shadow:0 6px 16px -10px rgba(0,44,102,.35);border-color:transparent;padding:8px 16px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--pri-soft);border-radius:16px;padding:10px 6px;text-align:center;min-width:0}
.kpi small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:22px;font-weight:600;color:var(--pri);line-height:1.3;white-space:nowrap}
.kpi>span{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi:first-child{background:linear-gradient(135deg,var(--pri2),var(--pri-d))}
.kpi:first-child small,.kpi:first-child>span{color:rgba(255,255,255,.75)}
.kpi:first-child b{color:#fff}
.heat-head,.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.heat-head{margin:16px 0 6px}
.heat-head span,.heat-days span{font-size:11px;color:var(--muted);text-align:center}
.hc{aspect-ratio:1;border-radius:9px;border:0;padding:0;font-size:11px;font-weight:400;display:grid;place-items:center;transition:transform .2s;min-width:0}
.hc:active{transform:scale(.88)}
.hc.blank{background:none}
.hc.l0{background:#EEF2F8;color:#A3AEC2}
.hc.l1{background:#C9D8EE;color:var(--pri)}
.hc.l2{background:#7FA6DA;color:#fff}
.hc.l3{background:var(--pri);color:#fff}
.hc.lx{background:none;border:1.5px dashed var(--line);color:#C3CAD6}
.hc.today{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
.heat-wrap{display:flex;gap:6px;margin-top:16px}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat-days span{display:grid;place-items:center;width:20px}
.heat.t{flex:1;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:4px}
.heat.t .hc{border-radius:5px}
.heat.t .hc.today{box-shadow:0 0 0 2px var(--acc)}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.heat-legend .hc{width:14px;height:14px;border-radius:4px;aspect-ratio:auto}
.bar-row{display:grid;grid-template-columns:76px minmax(0,1fr) 42px;align-items:center;gap:10px;margin:10px 0}
.bar-row b{font-size:13px;text-align:right;font-weight:500}
.bar{height:9px;border-radius:9px;background:var(--pri-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pri2),var(--pri));transition:width 1.1s var(--ease)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.split small{display:block;font-size:11.5px;color:var(--muted)}
.split b{display:block;font-size:22px;font-weight:600;color:var(--pri);line-height:1.25}
.split span{font-size:11px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcell{border-radius:16px;padding:12px 6px 10px;text-align:center;background:var(--pri-soft);position:relative;overflow:hidden;min-width:0}
.tcell::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--tc)}
.tcell b{display:block;font-size:22px;font-weight:600;margin-top:2px;line-height:1.3}
.tcell small{display:block;font-size:11px;color:var(--muted)}
.tcell .pill{margin-top:6px;font-size:10.5px;padding:1px 7px}
.var-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--ink2)}
.var-row .pill{margin:0}
.top-row{display:flex;align-items:center;gap:12px;margin:12px 0}
.top-row:last-child{margin-bottom:2px}
.rank{width:26px;height:26px;border-radius:9px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:13px;font-weight:500;flex:none}
.rank.r1{background:var(--acc);color:#fff}
.top-b{flex:1;min-width:0}
.top-t{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.top-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-t b{font-size:12.5px;color:var(--muted);font-weight:400;flex:none}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g-item{border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:none;transition:transform .2s var(--ease)}
.g-item:active{transform:scale(.95)}
.g-item .phbox{width:100%;height:100%}
.trend{display:flex;align-items:baseline;gap:8px}
.trend b{font-size:34px;font-weight:600;line-height:1.15}
.trend b.g{color:var(--ok)}
.trend b.w{color:var(--acc)}
.trend span{color:var(--muted);font-size:13px}
.eta{display:flex;gap:12px;align-items:center;background:var(--pri-soft);border-radius:16px;padding:12px 14px;margin-top:14px}
.eta>.ic{color:var(--acc);width:26px;height:26px}
.eta p{margin:0;font-size:13.5px;line-height:1.55}
.cross{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx{border-radius:16px;padding:12px 8px;text-align:center;background:var(--pri-soft);min-width:0}
.cx.best{background:var(--ok-soft)}
.cx small{display:block;font-size:11.5px;color:var(--muted)}
.cx b{display:block;font-size:24px;font-weight:600;color:var(--pri);margin:2px 0}
.cx.best b{color:var(--ok)}
.cx span{font-size:11px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--pri-soft),#fff);border:1px solid var(--pri-line)}
.banner .ic{color:var(--pri);width:26px;height:26px}
.banner p{margin:0;font-size:13px;flex:1;line-height:1.45}

/* Meals */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 150px;scroll-snap-align:start;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left;transition:transform .2s var(--ease)}
.mini:active{transform:scale(.97)}
.mini .phbox{height:112px}
.mini .mi-b{padding:10px 12px 12px}
.mini h4{margin:4px 0 0;font-size:14px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}

.phbox{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1,#EE8A76),var(--c2,#B5321E));display:grid;place-items:center}
.phbox>.ic{width:30px;height:30px;color:rgba(255,255,255,.85);stroke-width:1.5}
.phbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .6s,transform 1s var(--ease)}
.phbox img.ok{opacity:1;transform:none}
.phbox img.err{display:none}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:400;color:var(--ink2);min-width:0}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc,var(--acc));flex:none}

.datestrip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 54px;height:72px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:transform .35s var(--ease),background .35s}
.dchip small{font-size:11px;color:var(--muted)}
.dchip b{font-size:19px;font-weight:500}
.dchip i{position:absolute;bottom:8px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.dchip.all{flex-basis:64px}
.dchip.all b{font-size:13px}
.dchip.on{background:linear-gradient(160deg,var(--pri2),var(--pri-d));color:#fff;transform:translateY(-3px);box-shadow:0 14px 26px -10px rgba(0,44,102,.6)}
.dchip.on small{color:rgba(255,255,255,.7)}
.dchip.on i{background:#FFB4A6}

.daysum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:14px 8px}
.daysum div{border-right:1px solid var(--line)}
.daysum div:last-child{border:0}
.daysum b{display:block;font-size:20px;font-weight:600;color:var(--pri)}
.daysum b.o{color:var(--acc)}
.daysum small{font-size:11.5px;color:var(--muted)}

.dgroup-h{font-size:13px;color:var(--muted);margin:18px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--line),var(--line) 60%,transparent)}
.mcard{position:relative;display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:10px;margin-bottom:12px;width:100%;border:0;text-align:left;transition:transform .25s var(--ease)}
.mcard:active{transform:scale(.98)}
.mcard::before{content:"";position:absolute;left:-19px;top:22px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--tc,var(--acc))}
.mcard .phbox{width:84px;height:84px;border-radius:15px;flex:none}
.mcard .mc-b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-right:4px}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-top time{font-size:12px;color:var(--muted);flex:none}
.mcard h4{margin:4px 0 2px;font-size:15px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mcard p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:22px;background:var(--acc-soft);display:grid;place-items:center;margin:0 auto 12px}
.empty .eic .ic{color:var(--acc);width:30px;height:30px}
.empty p{margin:0 0 14px;font-size:14px}

/* Body */
.mtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mtiles .stat:first-child{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;transition:background .3s var(--ease),color .3s,border-color .3s;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chart-box{position:relative;height:210px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--pri-soft);border:0;padding:0}
.compare figure img{width:100%;height:100%;object-fit:cover;display:block;animation:fadeIn .6s}
.compare figcaption{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:#fff;background:rgba(0,44,102,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:5px 9px}
.compare figcaption b{font-weight:500}
.compare .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--pri);font-size:12.5px;text-align:center;padding:10px}
.cmp-diff{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.hrow:last-child{border-bottom:0}
.hdate{width:48px;text-align:center;flex:none;background:var(--pri-soft);border-radius:14px;padding:6px 0;position:relative}
.hdate b{display:block;font-size:17px;font-weight:600;line-height:1.1;color:var(--pri)}
.hdate small{font-size:10.5px;color:var(--muted)}
.hdate .cam{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.hdate .cam .ic{width:10px;height:10px;color:#fff;stroke-width:2.4}
.hvals{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;text-align:center;min-width:0}
.hvals span{font-size:13.5px;font-weight:400}
.hvals small{display:block;font-size:10px;color:var(--muted);white-space:nowrap}

/* Profile */
.prof{display:flex;align-items:center;gap:14px}
.avatar{width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg,var(--pri2),var(--pri-d));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:500;flex:none;position:relative}
.avatar::after{content:"";position:absolute;inset:-4px;border-radius:26px;border:2px solid var(--acc);opacity:.45}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;animation:fadeIn .5s}
.prof .avatar{width:72px;height:72px;border-radius:26px;font-size:28px;border:0;padding:0;cursor:pointer}
.prof .avatar::after{border-radius:30px}
.av-cam{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff;z-index:2}
.av-cam .ic{width:14px;height:14px;stroke-width:2.2}
.hero-text.with-av{display:flex;align-items:center;gap:14px}
.hero-text.with-av>div{flex:1;min-width:0}
.hero-av{width:58px;height:58px;border-radius:50%;border:0;padding:0;flex:none;font-size:22px;background:linear-gradient(135deg,var(--acc2),var(--acc-d));box-shadow:0 0 0 3px rgba(255,255,255,.85),0 10px 24px -8px rgba(0,0,0,.45)}
.hero-av::after{display:none}
.av-pick{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 18px}
.av-pick .avatar{width:112px;height:112px;border-radius:50%;font-size:40px;cursor:pointer;border:0;padding:0}
.av-pick .avatar::after{border-radius:50%;inset:-5px}
.av-pick .av-cam{width:34px;height:34px;right:2px;bottom:2px}
.av-pick .av-cam .ic{width:17px;height:17px}
.av-acts{display:flex;gap:18px}
.av-acts[hidden]{display:none}
.prof h2{margin:0;font-size:19px;font-weight:500;word-break:break-word}
.prof p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:right}
.goal-track{height:10px;border-radius:9px;background:var(--pri-soft);overflow:hidden;margin:10px 0 6px}
.goal-fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc-d));border-radius:9px;transition:width 1.4s var(--ease)}
.formula{font-size:12.5px;color:var(--ink2);line-height:1.6;padding:10px 0;border-bottom:1px dashed var(--line)}
.formula:last-child{border:0}
.formula b{color:var(--pri)}

/* Buttons */
.btn{position:relative;overflow:hidden;border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:400;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--ease),box-shadow .3s;min-height:50px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,var(--acc-d));color:#fff;box-shadow:0 12px 24px -10px rgba(209,64,41,.8)}
.btn-navy{background:var(--pri);color:#fff}
.btn-ghost{background:var(--pri-soft);color:var(--pri)}
.btn-danger{background:var(--acc-soft);color:var(--acc-d)}
.btn-block{width:100%}
.btn[disabled]{opacity:.75;pointer-events:none}
.btn .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
.btn-danger .spin,.btn-ghost .spin{border-color:rgba(0,64,143,.2);border-top-color:currentColor}
@keyframes rot{to{transform:rotate(360deg)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* Nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));width:calc(100% - 24px);max-width:496px;height:66px;background:rgba(0,44,102,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:40;box-shadow:0 20px 44px -14px rgba(0,44,102,.6)}
.nav .tab{background:none;border:0;color:rgba(255,255,255,.55);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;position:relative;transition:color .3s;white-space:nowrap}
.nav .tab .ic{transition:transform .4s var(--ease),color .3s}
.nav .tab.active{color:#fff}
.nav .tab.active .ic{color:#FF9C88;transform:translateY(-2px)}
.nav .tab::after{content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--acc2);transform:scale(0);transition:transform .35s var(--ease)}
.nav .tab.active::after{transform:scale(1)}
.fab{width:58px;height:58px;border-radius:20px;border:0;margin:-34px auto 0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc) 50%,var(--acc-d));box-shadow:0 14px 28px -8px rgba(209,64,41,.75),0 0 0 6px var(--bg);transition:transform .3s var(--ease);position:relative;overflow:hidden}
.fab:active{transform:scale(.92) rotate(90deg)}
.fab .ic{width:28px;height:28px;stroke-width:2.2}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,20,50,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92vh;max-height:92dvh;background:#fff;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .5s var(--ease),visibility 0s .5s;visibility:hidden;z-index:61;display:flex;flex-direction:column}
.sheet.open{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.sheet.drag{transition:none}
.sheet-handle{padding:10px 0 6px;display:grid;place-items:center;touch-action:none;flex:none}
.sheet-handle span{width:44px;height:5px;border-radius:9px;background:#D6DEEA}
.sheet-body{overflow-y:auto;padding:4px 20px calc(24px + var(--sb));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 16px}
.sheet-title h2{margin:0;font-size:20px;font-weight:500}
.xbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--pri-soft);display:grid;place-items:center;color:var(--pri);flex:none}
.xbtn .ic{width:18px;height:18px}

.choose{display:grid;gap:12px}
.choose button{display:flex;align-items:center;gap:14px;border:0;border-radius:20px;padding:18px;text-align:left;background:var(--pri-soft);color:var(--ink);transition:transform .2s var(--ease);position:relative;overflow:hidden}
.choose button:active{transform:scale(.97)}
.choose button:first-child{background:linear-gradient(135deg,var(--pri2),var(--pri-d));color:#fff}
.choose .cic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc2),var(--acc-d));color:#fff;flex:none}
.choose b{display:block;font-size:16px;font-weight:500}
.choose small{font-size:12.5px;opacity:.7}

/* Forms */
.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px 2px}
.inp{display:block;width:100%;min-height:50px;border:1.5px solid var(--line);background:#FAFBFD;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:300;outline:none;transition:border-color .25s,box-shadow .25s,background .25s;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(0,64,143,.12)}
.inp::placeholder{color:#AEB7C6}
input[type=date].inp,input[type=time].inp{text-align:left}
.inp::-webkit-date-and-time-value{text-align:left}
textarea.inp{resize:none;min-height:76px}
.unit{position:relative}
.unit .inp{padding-right:46px}
.unit em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.typechips{display:flex;flex-wrap:wrap;gap:8px}
.typechips input{position:absolute;opacity:0;pointer-events:none}
.typechips label{margin:0;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:.25s var(--ease)}
.typechips label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.typechips input:checked+label{background:var(--pri);border-color:var(--pri);color:#fff}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px -20px 0;padding:0 20px 2px}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{font-size:12.5px;padding:5px 12px;background:var(--pri-soft);border-color:transparent;color:var(--pri)}
.seg{display:flex;background:var(--pri-soft);border-radius:14px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;margin:0;text-align:center;padding:10px;border-radius:11px;font-size:14px;color:var(--ink2);transition:.3s var(--ease)}
.seg input:checked+label{background:#fff;color:var(--pri);box-shadow:0 4px 12px -4px rgba(0,44,102,.25);font-weight:400}
.photo-pick{position:relative;height:210px;border-radius:20px;border:2px dashed var(--pri-line);background:var(--pri-soft);display:grid;place-items:center;overflow:hidden;margin-bottom:16px;cursor:pointer}
.photo-pick .ph-ph{text-align:center;color:var(--pri);font-size:14px}
.photo-pick .ph-ph .ic{width:34px;height:34px;display:block;margin:0 auto 6px}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeIn .5s}
.photo-pick.has{border-style:solid;border-color:transparent}
.photo-actions{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:2}
.photo-actions[hidden]{display:none}
.photo-actions button{border:0;border-radius:12px;padding:8px 12px;font-size:13px;background:rgba(0,44,102,.78);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.poses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pose{position:relative;aspect-ratio:3/4;border-radius:16px;border:2px dashed var(--pri-line);background:var(--pri-soft);overflow:hidden;display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease)}
.pose:active{transform:scale(.97)}
.pose img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeIn .5s}
.pose .pl{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--pri);font-size:12.5px;text-align:center}
.pose .pl .ic{width:26px;height:26px}
.pose .pt{display:none;position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,44,102,.75);color:#fff;padding:2px 8px;border-radius:99px}
.pose .prm{display:none;position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:10px;border:0;background:rgba(0,44,102,.75);color:#fff;place-items:center;padding:0}
.pose .prm .ic{width:14px;height:14px;stroke-width:2.4}
.pose.has{border-style:solid;border-color:transparent}
.pose.has .pl{display:none}
.pose.has .pt{display:block}
.pose.has .prm{display:grid}

/* Detail */
.detail-photo{height:min(64vw,300px);border-radius:22px;margin-bottom:16px;cursor:zoom-in}
.dvals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.dvals div{background:var(--pri-soft);border-radius:16px;padding:10px 4px;text-align:center}
.dvals div:first-child{background:linear-gradient(135deg,var(--pri2),var(--pri-d));color:#fff}
.dvals b{display:block;font-size:18px;font-weight:600}
.dvals small{font-size:11px;opacity:.75}
.dposes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.dposes figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--pri-soft)}
.dposes img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.dposes figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,44,102,.75);color:#fff;padding:2px 8px;border-radius:99px}
.dposes .noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;color:var(--muted)}
.note{background:#FAFBFD;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2);white-space:pre-wrap;word-break:break-word;margin-bottom:16px}

/* Lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,12,30,.94);display:grid;place-items:center;padding:calc(20px + var(--st)) 12px calc(20px + var(--sb));opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#lb.show{opacity:1;visibility:visible}
#lb img{max-width:100%;max-height:100%;border-radius:14px;transform:scale(.94);transition:transform .4s var(--ease)}
#lb.show img{transform:none}
#lb .xbtn{position:absolute;top:calc(14px + var(--st));right:14px;background:rgba(255,255,255,.14);color:#fff}

/* PIN */
#pin{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + var(--st)) 24px calc(30px + var(--sb));color:#fff;background:radial-gradient(120% 70% at 85% 0%,rgba(209,64,41,.38),transparent 60%),linear-gradient(170deg,#00408F,#002C66 70%);opacity:0;visibility:hidden;transform:scale(1.04);transition:opacity .4s var(--ease),transform .4s var(--ease),visibility .4s}
#pin.show{opacity:1;visibility:visible;transform:none}
#pin .pclose{position:absolute;top:calc(14px + var(--st));right:14px;background:rgba(255,255,255,.12);color:#fff}
.plock{width:62px;height:62px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:16px}
.plock .ic{width:28px;height:28px;color:#FFB4A6}
#pin h2{margin:0;font-weight:500;font-size:21px;text-align:center}
#pin p{margin:6px 0 0;font-size:13px;opacity:.7;min-height:20px;text-align:center}
#pin p.err{color:#FFB4A6;opacity:1}
.dots{display:flex;gap:16px;margin:26px 0 32px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);transition:.25s var(--ease)}
.dots i.f{background:var(--acc2);border-color:var(--acc2);transform:scale(1.15);box-shadow:0 0 14px rgba(232,102,79,.8)}
.dots.shake{animation:shake .45s}
.dots.okk i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px rgba(23,166,115,.7)}
.dots.wait i.f{animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,min(76px,21vw));gap:min(16px,3.6vh) min(26px,6vw)}
.keys button{width:100%;aspect-ratio:1;max-height:9.5vh;max-width:9.5vh;justify-self:center;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:28px;font-weight:300;transition:background .2s,transform .15s;display:grid;place-items:center;padding:0}
.keys button:active{background:rgba(209,64,41,.55);transform:scale(.92)}
.keys button.blank{visibility:hidden}
.keys button.del{border:0;background:none}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translate(-50%,20px);background:var(--pri-d);color:#fff;padding:11px 18px;border-radius:16px;font-size:13.5px;z-index:95;opacity:0;pointer-events:none;transition:.4s var(--ease);box-shadow:0 14px 30px -10px rgba(0,44,102,.6);display:flex;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 40px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--acc-d)}
#toast .ic{width:18px;height:18px;color:#FFB4A6;flex:none}
#toast.err .ic{color:#fff}
body.lock #toast{bottom:calc(24px + var(--sb))}

.skel{background:linear-gradient(90deg,#EDF1F7 25%,#F7F9FC 50%,#EDF1F7 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:359px){.ring-wrap{width:112px;height:112px}.ring-center b{font-size:28px}.stat .val{font-size:21px}.brand span:not(.demo-badge){display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:560px){body{background:linear-gradient(#E6ECF5,#F5F7FB)}}
</style>
</head>
<body>

<div id="splash"><div class="splash-in"><div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.4 0-3.6 3-3.6 7 0 2.2 1.2 3 3.6 3"/></svg></div><h1>MEAL JOURNAL</h1><p>กำลังโหลดข้อมูล…</p></div></div>

<div class="app">
  <header class="hero">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="hero-top">
      <div class="brand"><div class="mark" id="brandMark"></div><span>MEAL JOURNAL</span><span id="demoBadge"></span></div>
      <button class="mode" id="modeBtn"></button>
    </div>
    <div class="hero-text" id="heroText"></div>
  </header>

  <main class="content">
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-meals"></section>
    <section class="page" id="page-body"></section>
    <section class="page" id="page-profile"></section>
  </main>

function calc() {
  const p = S.profile, h = num(p.height), sex = p.sex;

  const w = last('weight'), waist = last('waist'), hip = last('hip');
  const r = { w, waist, hip, h, sex };
  r.bmi = w && h ? w / ((h / 100) ** 2) : null;
  r.whr = waist && hip ? waist / hip : null;
  r.whtr = waist && h ? waist / h : null;

}
function bmiLabel(b) { if (b == null) return null; if (b < 18.5) return ['น้ำหนักน้อย', 'warn']; if (b < 23) return ['สมส่วน', 'good']; if (b < 25) return ['ท้วม', 'warn']; if (b < 30) return ['อ้วน', 'bad']; return ['อ้วนมาก', 'bad']; }

}

const sdev = a => { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); };
const toMin = t => { const [h, m] = String(t || '').split(':').map(Number); return isFinite(h) ? h * 60 + (m || 0) : null; };
const fromMin = v => { v = Math.round(v); return pad(Math.floor(v / 60) % 24) + ':' + pad(v % 60); };
const dayRange = (end, n) => [...Array(n)].map((_, i) => addDays(end, i - n + 1));
const isWeekend = d => { const w = parseD(d).getDay(); return w === 0 || w === 6; };
const normName = s => String(s || '').trim().replace(/\s+/g, ' ');
const PERIODS = [7, 30, 90];
const ANA_TABS = [['consistency', 'ความสม่ำเสมอ'], ['timing', 'เวลากิน'], ['menu', 'เมนู'], ['body', 'ร่างกาย']];

function bestStreak() {
  const ds = [...new Set(S.meals.map(m => m.date))].sort();
  let best = 0, cur = 0, prev = null;
  ds.forEach(d => { cur = prev && addDays(prev, 1) === d ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
  return best;
}

function analyze(P) {
  const t = today(), byDate = {};
  S.meals.forEach(m => (byDate[m.date] = byDate[m.date] || []).push(m));
  const on = d => byDate[d] || [];
  const mainCnt = d => MAIN.filter(k => on(d).some(m => m.type === k)).length;
  const firstLog = S.meals.reduce((a, m) => (!a || m.date < a ? m.date : a), null);
  const end = mainCnt(t) === 3 ? t : addDays(t, -1);          // today counts only once complete
  const days = dayRange(end, P).filter(d => firstLog && d >= firstLog);
  const prevDays = dayRange(addDays(end, -P), P).filter(d => firstLog && d >= firstLog);
  const start = addDays(t, -P + 1), prevStart = addDays(start, -P);
  const inP = S.meals.filter(m => m.date >= start && m.date <= t);
  const inPrev = S.meals.filter(m => m.date >= prevStart && m.date < start);
  const A = { P, t, start, on, mainCnt, firstLog, days, inP };

  // consistency
  A.full = days.filter(d => mainCnt(d) === 3).length;
  A.rate = days.length ? A.full / days.length : null;
  A.prevRate = prevDays.length >= Math.min(P, 3) ? prevDays.filter(d => mainCnt(d) === 3).length / prevDays.length : null;
  A.perType = MAIN.map(k => ({ k, n: days.filter(d => on(d).some(m => m.type === k)).length }));
  A.avgPerDay = days.length ? mean(days.map(d => on(d).length)) : null;
  const we = days.filter(isWeekend), wd = days.filter(d => !isWeekend(d));
  A.weAvg = we.length ? mean(we.map(mainCnt)) : null;
  A.wdAvg = wd.length ? mean(wd.map(mainCnt)) : null;
  A.best = bestStreak();

  // timing
  const tstats = arr => MAIN.map(k => { const v = arr.filter(m => m.type === k).map(m => toMin(m.time)).filter(x => x != null); return { k, avg: mean(v), sd: sdev(v), n: v.length }; });
  A.time = tstats(inP); A.prevTime = tstats(inPrev);
  A.windows = dayRange(t, P).map(d => { const v = on(d).map(m => toMin(m.time)).filter(x => x != null); return { d, n: v.length, min: v.length ? Math.min(...v) : null, max: v.length ? Math.max(...v) : null }; });
  const ww = A.windows.filter(w => w.n >= 2).map(w => w.max - w.min);
  A.avgWindow = ww.length ? mean(ww) : null;
  const lasts = A.windows.filter(w => w.n).map(w => w.max);
  A.avgLast = lasts.length ? mean(lasts) : null;
  const dinners = inP.filter(m => m.type === 'มื้อเย็น');
  A.dinnerN = dinners.length;
  A.lateDinner = dinners.filter(m => toMin(m.time) >= 20 * 60).length;

  // menus
  const cnt = {}, firstSeen = {};
  inP.forEach(m => { const n = normName(m.name); if (!n) return; (cnt[n] = cnt[n] || { name: n, n: 0 }).n++; });
  S.meals.forEach(m => { const n = normName(m.name); if (n && (!firstSeen[n] || m.date < firstSeen[n])) firstSeen[n] = m.date; });
  A.top = Object.values(cnt).sort((a, b) => b.n - a.n).slice(0, 5);
  A.unique = Object.keys(cnt).length;
  A.total = inP.length;
  const vrs = [];
  for (let i = 0; i < P; i += 7) {
    const a = addDays(start, i), b = addDays(start, Math.min(i + 6, P - 1));
    const ch = inP.filter(m => m.date >= a && m.date <= b && normName(m.name));
    if (ch.length >= 3) vrs.push(new Set(ch.map(m => normName(m.name))).size / ch.length);
  }
  A.variety = vrs.length ? mean(vrs) : null;
  A.photoPct = inP.length ? inP.filter(m => m.photoUrl).length / inP.length : null;
  A.newMenus = firstLog && firstLog < start ? Object.keys(cnt).filter(n => firstSeen[n] >= start).length : null;
  A.photos = inP.filter(m => m.photoUrl).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 9);

  // body: weight trend by least squares
  const ws = seriesOf('weight');
  let pts = ws.filter(p => p.date >= start);
  if (pts.length < 2) pts = ws.slice(-4);
  if (pts.length >= 2) {
    const x0 = parseD(pts[0].date).getTime();
    const xs = pts.map(p => (parseD(p.date).getTime() - x0) / 864e5), ys = pts.map(p => p.v);
    const mx = mean(xs), my = mean(ys), den = xs.reduce((s, x) => s + (x - mx) ** 2, 0);
    if (den > 0) { A.rateWk = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / den * 7; A.rateFrom = pts[0].date; }
  }
  A.target = num(S.profile.targetWeight); A.cur = ws.length ? ws[ws.length - 1] : null;
  A.wantDown = !A.target || !A.cur || A.target < A.cur.v;
  A.reached = A.target && A.cur && Math.abs(A.cur.v - A.target) < 0.15;
  if (A.target && A.cur && !A.reached && A.rateWk && Math.abs(A.rateWk) >= 0.02 && Math.sign(A.target - A.cur.v) === Math.sign(A.rateWk)) {
    const wk = (A.target - A.cur.v) / A.rateWk;
    if (wk > 0 && wk < 260) A.eta = addDays(A.cur.date, Math.round(wk * 7));
  }
  // consistency x weight: weekly change between weigh-ins, split by how complete the logging was
  const pairs = [];
  for (let i = 1; i < ws.length && firstLog; i++) {
    const a = ws[i - 1], b = ws[i], gap = Math.round((parseD(b.date) - parseD(a.date)) / 864e5);
    if (gap < 3) continue;
    const ds = dayRange(addDays(b.date, -1), gap).filter(d => d >= firstLog);
    if (ds.length < gap * 0.6) continue;
    pairs.push({ r: ds.filter(d => mainCnt(d) === 3).length / ds.length, wk: (b.v - a.v) / gap * 7 });
  }
  const hi = pairs.filter(p => p.r >= 0.7), lo = pairs.filter(p => p.r < 0.7);
  A.cross = hi.length && lo.length ? { hi: mean(hi.map(p => p.wk)), lo: mean(lo.map(p => p.wk)), nh: hi.length, nl: lo.length } : null;
  return A;
}

function insights(A) {
  const L = [], add = (tone, ic, html) => L.push({ tone, ic, html });
  if (!S.meals.length) return [{ tone: 'info', ic: 'info', html: 'เริ่มบันทึกมื้ออาหาร แล้วระบบจะวิเคราะห์ให้อัตโนมัติ' }];
  if (A.rate != null) {
    let s = `บันทึกครบ 3 มื้อ <b>${A.full}/${A.days.length} วัน</b> (${fmt(A.rate * 100)}%)`;
    if (A.prevRate != null) { const d = Math.round((A.rate - A.prevRate) * 100); if (Math.abs(d) >= 5) s += ` · ${d > 0 ? 'ดีขึ้น' : 'ลดลง'} ${Math.abs(d)}% จากช่วงก่อน`; }
    add(A.rate >= 0.7 ? 'good' : 'warn', 'check', s);
  }
  if (A.reached) add('good', 'flag', `ถึงน้ำหนักเป้าหมาย <b>${fmt(A.target, 1)} กก.</b> แล้ว ยินดีด้วย!`);
  else if (A.rateWk != null) {
    let s = `น้ำหนัก${A.rateWk < 0 ? 'ลดลง' : 'เพิ่มขึ้น'}เฉลี่ย <b>${fmt(Math.abs(A.rateWk), 2)} กก./สัปดาห์</b>`;
    if (A.eta) s += ` · ถ้ารักษาจังหวะนี้ จะถึง ${fmt(A.target, 1)} กก. ประมาณ <b>${thDate(A.eta, { month: 'short', year: '2-digit' })}</b>`;
    add((A.wantDown ? A.rateWk <= 0 : A.rateWk >= 0) ? 'good' : 'warn', 'body', s);
  }
  if (A.days.length >= 3) {
    const miss = A.perType.map(x => ({ ...x, miss: A.days.length - x.n })).sort((a, b) => b.miss - a.miss)[0];
    if (miss.miss > 0) add('warn', 'meal', `มักข้าม<b>${miss.k}</b> (ไม่ได้บันทึก ${miss.miss} จาก ${A.days.length} วัน)`);
    else add('good', 'check', 'ไม่ได้ข้ามมื้อหลักเลยในช่วงนี้ เยี่ยมมาก');
  }
  const dn = A.time[2], pdn = A.prevTime[2];
  if (dn.avg != null) {
    if (dn.avg >= 20 * 60) add('warn', 'clock', `มื้อเย็นเฉลี่ย <b>${fromMin(dn.avg)} น.</b> ค่อนข้างดึก`);
    else if (pdn.avg != null && Math.abs(dn.avg - pdn.avg) >= 20) add(dn.avg < pdn.avg ? 'good' : 'warn', 'clock', `มื้อเย็นเฉลี่ย <b>${fromMin(dn.avg)} น.</b> ${dn.avg < pdn.avg ? 'เร็วขึ้น' : 'ช้าลง'} ${fmt(Math.abs(dn.avg - pdn.avg))} นาทีจากช่วงก่อน`);
  }
  if (A.weAvg != null && A.wdAvg != null && Math.abs(A.weAvg - A.wdAvg) >= 0.5)
    add('info', 'calendar', `วันเสาร์–อาทิตย์บันทึก${A.weAvg < A.wdAvg ? 'น้อยกว่า' : 'ครบกว่า'}วันธรรมดา (เฉลี่ย ${fmt(A.weAvg, 1)} กับ ${fmt(A.wdAvg, 1)} มื้อหลัก)`);
  if (A.top.length && A.top[0].n >= 3) add('info', 'star', `เมนูที่กินบ่อยสุด: <b>${esc(A.top[0].name)}</b> (${A.top[0].n} ครั้ง)`);
  return L.slice(0, 5);
}

const kpi = (label, val, sub) => `<div class="kpi"><small>${label}</small><b>${val}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
const cnum = (v, dec = 0) => v == null || !isFinite(v) ? '—' : `<span data-count="${v}" data-dec="${dec}">0</span>`;
const emptyAna = cls => `<div class="card empty ${cls}" style="--d:6"><div class="eic">${icon('meal')}</div><p>ยังไม่มีข้อมูลในช่วง ${S.anaP} วันนี้</p><button class="btn btn-primary" data-add="meal">${icon('camera')}บันทึกมื้ออาหาร</button></div>`;

function tabConsistency(A, cls) {
  if (!S.meals.length) return emptyAna(cls);
  const cells = dayRange(A.t, A.P), lead = (parseD(cells[0]).getDay() + 6) % 7, tr = A.P > 35;
  const heads = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
  const lvl = d => A.firstLog && d >= A.firstLog ? A.mainCnt(d) : -1;
  const html = '<i class="hc blank"></i>'.repeat(lead) + cells.map(d => { const l = lvl(d); return `<button class="hc l${l < 0 ? 'x' : l}${d === A.t ? ' today' : ''}" data-goday="${d}" aria-label="${thDate(d)} ${Math.max(l, 0)} มื้อหลัก">${tr ? '' : parseD(d).getDate()}</button>`; }).join('');
  const weeks = Math.ceil((lead + cells.length) / 7), dl = A.days.length;
  const heat = tr
    ? `<div class="heat-wrap"><div class="heat-days">${heads.map(h => `<span>${h}</span>`).join('')}</div><div class="heat t" style="grid-template-columns:repeat(${weeks},minmax(0,1fr))">${html}</div></div>`
    : `<div class="heat-head">${heads.map(h => `<span>${h}</span>`).join('')}</div><div class="heat">${html}</div>`;
  return `
  <section class="card ${cls}" style="--d:6">
    <div class="kpis">${kpi('ครบ 3 มื้อ', A.rate == null ? '—' : cnum(A.rate * 100) + '%', dl ? `${A.full}/${dl} วัน` : '')}${kpi('ต่อเนื่องสูงสุด', cnum(A.best), 'วัน')}${kpi('เฉลี่ยต่อวัน', cnum(A.avgPerDay, 1), 'มื้อ')}</div>
    ${heat}
    <div class="heat-legend"><span>0</span>${[0, 1, 2, 3].map(l => `<i class="hc l${l}"></i>`).join('')}<span>3 มื้อหลัก · แตะวันเพื่อดูมื้อ</span></div>
  </section>
  <section class="card ${cls}" style="--d:7">
    <h4 class="card-h">บันทึกแต่ละมื้อ</h4>
    ${A.perType.map(x => { const tt = typeOf(x.k), pct = dl ? x.n / dl * 100 : 0; return `<div class="bar-row"><span class="tag" style="--tc:${tt.c}">${tt.s}</span><div class="bar"><i data-w="${pct}" style="background:${tt.c}"></i></div><b>${fmt(pct)}%</b></div>`; }).join('')}
    ${A.wdAvg != null && A.weAvg != null ? `<div class="split"><div><small>จันทร์–ศุกร์</small><b>${fmt(A.wdAvg, 1)}</b><span>มื้อหลัก/วัน</span></div><div><small>เสาร์–อาทิตย์</small><b>${fmt(A.weAvg, 1)}</b><span>มื้อหลัก/วัน</span></div></div>` : ''}
  </section>`;
}

function tabTiming(A, cls) {
  if (!A.inP.length) return emptyAna(cls);
  return `
  <section class="card ${cls}" style="--d:6"><h4 class="card-h">เวลาเฉลี่ยแต่ละมื้อ</h4>
    <div class="tgrid">${A.time.map((x, i) => { const tt = typeOf(x.k), p = A.prevTime[i], diff = x.avg != null && p.avg != null ? Math.round(x.avg - p.avg) : null;
      return `<div class="tcell" style="--tc:${tt.c}"><span class="tag" style="--tc:${tt.c}">${tt.s}</span><b>${x.avg == null ? '—' : fromMin(x.avg)}</b><small>${x.sd != null ? '± ' + fmt(x.sd) + ' นาที' : x.n ? x.n + ' ครั้ง' : 'ไม่มีข้อมูล'}</small>${diff != null && Math.abs(diff) >= 10 ? `<span class="pill ${diff < 0 ? 'good' : 'warn'}">${diff < 0 ? 'เร็วขึ้น' : 'ช้าลง'} ${Math.abs(diff)} น.</span>` : ''}</div>`; }).join('')}</div>
    <p class="hint-p">± คือความคลาดเคลื่อนของเวลา ยิ่งน้อยแปลว่ากินตรงเวลาสม่ำเสมอ</p>
  </section>
  <section class="card ${cls}" style="--d:7"><h4 class="card-h">ช่วงเวลากินแต่ละวัน</h4>
    <div class="chart-box" style="height:250px"><canvas id="timeChart"></canvas></div>
    <div class="legend"><span class="tag" style="--tc:#C9D8EE">มื้อแรก–มื้อสุดท้าย</span>${MEAL_TYPES.map(t => `<span class="tag" style="--tc:${t.c}">${t.s}</span>`).join('')}</div>
  </section>
  <section class="card ${cls}" style="--d:8">
    <div class="kpis">${kpi('ช่วงกินเฉลี่ย', cnum(A.avgWindow == null ? null : A.avgWindow / 60, 1), 'ชม./วัน')}${kpi('มื้อสุดท้าย', A.avgLast == null ? '—' : fromMin(A.avgLast), 'น. โดยเฉลี่ย')}${kpi('เย็นหลัง 20:00', cnum(A.lateDinner), A.dinnerN ? `จาก ${A.dinnerN} มื้อ` : 'มื้อ')}</div>
    <p class="hint-p">ช่วงกิน = เวลาจากมื้อแรกถึงมื้อสุดท้ายของวัน นับเฉพาะวันที่บันทึก 2 มื้อขึ้นไป</p>
  </section>`;
}
function drawTimeChart(A) {
  const W = A.windows, all = W.filter(w => w.n).flatMap(w => [w.min, w.max]);
  const lo = all.length ? Math.max(0, Math.floor((Math.min(...all) - 30) / 60) * 60) : 360;
  const hi = all.length ? Math.min(1440, Math.ceil((Math.max(...all) + 30) / 60) * 60) : 1320;
  makeChart('timeChart', {
    data: {
      labels: W.map(w => A.P <= 7 ? wdName(w.d) : String(parseD(w.d).getDate())),
      datasets: [
        { type: 'bar', label: 'ช่วงกิน', data: W.map(w => w.n >= 2 ? [w.min, w.max] : null), backgroundColor: 'rgba(0,64,143,.13)', borderRadius: 8, borderSkipped: false, barPercentage: .7, categoryPercentage: .9, order: 2 },
        ...MEAL_TYPES.map(tt => ({ type: 'line', label: tt.s, showLine: false, order: 1, pointRadius: A.P > 30 ? 2.5 : A.P > 7 ? 4 : 6, pointHoverRadius: 7, pointBackgroundColor: tt.c, pointBorderColor: '#fff', pointBorderWidth: A.P > 30 ? 0 : 1.5,
          data: W.map(w => { const m = A.on(w.d).find(x => x.type === tt.k); return m ? toMin(m.time) : null; }) }))
      ]
    },
    options: { maintainAspectRatio: false, animation: { duration: 900, easing: 'easeOutQuart' }, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, displayColors: true, filter: i => i.raw != null,
        callbacks: { title: it => thDate(W[it[0].dataIndex].d, { weekday: 'short', day: 'numeric', month: 'short' }), label: i => Array.isArray(i.raw) ? ` ช่วงกิน ${fromMin(i.raw[0])}–${fromMin(i.raw[1])}` : ` ${i.dataset.label} ${fromMin(i.raw)}` } } },
      scales: { x: { grid: { display: false }, border: { display: false }, ticks: { autoSkip: true, maxTicksLimit: A.P <= 7 ? 7 : 8, maxRotation: 0 } },
        y: { reverse: true, min: lo, max: hi, grid: { color: '#EEF2F8' }, border: { display: false }, ticks: { stepSize: (hi - lo) > 600 ? 180 : 120, callback: v => fromMin(v) } } } }
  });
}

function tabMenu(A, cls) {
  if (!A.inP.length) return emptyAna(cls);
  const max = A.top.length ? A.top[0].n : 1, vr = A.variety;
  const vl = vr == null ? ['ข้อมูลยังน้อย', ''] : vr >= 0.6 ? ['หลากหลายมาก', 'good'] : vr >= 0.4 ? ['ปานกลาง', ''] : ['ค่อนข้างซ้ำ', 'warn'];
  return `
  <section class="card ${cls}" style="--d:6">
    <div class="kpis">${kpi('มื้อทั้งหมด', cnum(A.total), 'มื้อ')}${kpi('เมนูไม่ซ้ำ', cnum(A.unique), A.newMenus != null ? `ใหม่ ${A.newMenus} เมนู` : 'เมนู')}${kpi('มีรูป', A.photoPct == null ? '—' : cnum(A.photoPct * 100) + '%', 'ของทุกมื้อ')}</div>
    <div class="var-row"><span>ความหลากหลายของเมนู<small class="muted" style="display:block;font-size:11px">${vr == null ? 'วัดจากเมนูไม่ซ้ำในแต่ละสัปดาห์' : `เฉลี่ยไม่ซ้ำ ${fmt(vr * 100)}% ต่อสัปดาห์`}</small></span><span class="pill ${vl[1]}">${vl[0]}</span></div>
  </section>
  <section class="card ${cls}" style="--d:7"><h4 class="card-h">เมนูที่กินบ่อย</h4>
    ${A.top.map((x, i) => `<div class="top-row"><span class="rank${i ? '' : ' r1'}">${i + 1}</span><div class="top-b"><div class="top-t"><span>${esc(x.name)}</span><b>${x.n} ครั้ง</b></div><div class="bar"><i data-w="${x.n / max * 100}"></i></div></div></div>`).join('')}
  </section>
  <section class="card ${cls}" style="--d:8"><h4 class="card-h">รูปอาหารล่าสุด</h4>
    ${A.photos.length ? `<div class="gallery">${A.photos.map(m => `<button class="g-item" data-meal="${esc(m.id)}" aria-label="${esc(m.name)}">${photoBox(m)}</button>`).join('')}</div>` : '<p class="hint-p" style="margin:0">ยังไม่มีรูปอาหารในช่วงนี้ ถ่ายรูปตอนบันทึกมื้อเพื่อดูย้อนหลังได้</p>'}
  </section>`;
}

function tabBody(A, cls) {
  if (!S.body.length) return `<div class="card empty ${cls}" style="--d:6"><div class="eic">${icon('ruler')}</div><p>ยังไม่มีข้อมูลสัดส่วน</p><button class="btn btn-primary" data-add="body">${icon('plus')}บันทึกสัดส่วน</button></div>`;
  const c = calc(), ws = seriesOf('weight'), st = (...a) => statTile(...a).replace(' reveal"', ' ' + cls + '"');
  const wd = ws.length > 1 ? ws[ws.length - 1].v - ws[ws.length - 2].v : null;
  const wLabel = wd == null ? null : [(wd <= 0 ? '▼ ' : '▲ ') + fmt(Math.abs(wd), 1) + ' กก. จากครั้งก่อน', wd <= 0 ? 'good' : 'warn'];
  const changes = METRICS.map(m => { const s = seriesOf(m.k).filter(p => p.date >= A.start); if (s.length < 2) return ''; const d = s[s.length - 1].v - s[0].v; return `<span class="pill ${d <= 0 ? 'good' : 'warn'}">${m.th} ${signed(d)} ${m.u}</span>`; }).join('');
  const good = A.rateWk != null && (A.wantDown ? A.rateWk <= 0 : A.rateWk >= 0);
  let eta;
  if (!A.target) eta = `<div class="eta">${icon('flag')}<p>ตั้งน้ำหนักเป้าหมาย เพื่อดูว่าจะถึงเป้าเมื่อไหร่ <button class="link" data-edit-profile>ตั้งเป้า</button></p></div>`;
  else if (A.reached) eta = `<div class="eta">${icon('flag')}<p>ถึงเป้า <b>${fmt(A.target, 1)} กก.</b> แล้ว ยินดีด้วย!</p></div>`;
  else if (A.eta) eta = `<div class="eta">${icon('flag')}<p>ถ้ารักษาจังหวะนี้ จะถึง <b>${fmt(A.target, 1)} กก.</b><br>ประมาณ <b>${thDate(A.eta, { day: 'numeric', month: 'long', year: 'numeric' })}</b></p></div>`;
  else if (A.rateWk != null) eta = `<div class="eta">${icon('flag')}<p>แนวโน้มตอนนี้ยังไม่เข้าใกล้เป้า <b>${fmt(A.target, 1)} กก.</b></p></div>`;
  else eta = '';
  const cr = A.cross;
  let crossHTML = '<p class="hint-p" style="margin:0">ต้องมีการชั่งน้ำหนักหลายครั้ง ทั้งช่วงที่บันทึกอาหารครบและไม่ครบ ระบบจึงจะเปรียบเทียบให้ได้</p>';
  if (cr) {
    const hiBetter = A.wantDown ? cr.hi < cr.lo : cr.hi > cr.lo, clear = Math.abs(cr.hi - cr.lo) >= 0.05;
    crossHTML = `<div class="cross"><div class="cx ${clear && hiBetter ? 'best' : ''}"><small>ช่วงบันทึกครบ ≥70%</small><b>${signed(cr.hi, 2)}</b><span>กก./สัปดาห์ · ${cr.nh} ช่วง</span></div><div class="cx ${clear && !hiBetter ? 'best' : ''}"><small>ช่วงบันทึกครบ &lt;70%</small><b>${signed(cr.lo, 2)}</b><span>กก./สัปดาห์ · ${cr.nl} ช่วง</span></div></div>
      <p class="hint-p">${!clear ? 'ยังไม่เห็นความต่างชัดเจนระหว่างสองช่วง' : hiBetter ? 'ช่วงที่บันทึกอาหารครบ น้ำหนักไปทางเป้าหมายได้ดีกว่า' : 'ช่วงที่บันทึกไม่ครบกลับไปทางเป้าหมายได้ดีกว่า ลองดูว่ามื้อที่บันทึกต่างกันอย่างไร'}</p>`;
  }
  return `
  <div class="stats" style="margin-bottom:14px">
    ${st('น้ำหนักล่าสุด', c.w, 1, 'กก.', wLabel, 'dark', 6)}
    ${st('เปลี่ยนแปลงรวม', c.wTotal, 1, 'กก.', c.wFirst && c.wTotal != null ? ['ตั้งแต่ ' + thDate(c.wFirst.date), c.wTotal <= 0 ? 'good' : 'warn'] : null, '', 6, true)}
    ${st('BMI', c.bmi, 1, '', bmiLabel(c.bmi), '', 7)}
    ${st('% ไขมัน (RFM)', c.rfm, 1, '%', rfmLabel(c.rfm, c.sex), '', 7)}
    ${st('เอว / สะโพก', c.whr, 2, '', whrLabel(c.whr, c.sex), '', 8)}
    ${st('เอว / ส่วนสูง', c.whtr, 2, '', whtrLabel(c.whtr), '', 8)}
  </div>
  <section class="card ${cls}" style="--d:9"><h4 class="card-h">แนวโน้มน้ำหนัก</h4>
    ${A.rateWk != null ? `<div class="trend"><b class="${good ? 'g' : 'w'}">${signed(A.rateWk, 2)}</b><span>กก./สัปดาห์</span></div><p class="hint-p" style="margin-top:4px">คำนวณจากเส้นแนวโน้มการชั่ง ตั้งแต่ ${thDate(A.rateFrom)}</p>` : '<p class="hint-p" style="margin:0">ต้องชั่งน้ำหนักอย่างน้อย 2 ครั้ง</p>'}
    ${eta}
    ${changes ? `<div class="cmp-diff"><small class="muted" style="width:100%">เปลี่ยนแปลงในช่วง ${A.P} วัน</small>${changes}</div>` : ''}
  </section>
  <section class="card ${cls}" style="--d:10"><h4 class="card-h">ความสม่ำเสมอ × น้ำหนัก</h4>${crossHTML}</section>`;
}

function renderCompare() {

  const fig = (r, lbl) => r
    ? `<figure data-lb="${esc(r[pk + 'Url'])}">${imgTag(r[pk + 'Url'])}<figcaption><b>${lbl}</b><span>${thDate(r.date, { day: 'numeric', month: 'short', year: '2-digit' })}</span></figcaption></figure>`
    : `<figure><div class="noimg">${icon('camera')}<br>${lbl === 'ก่อน' ? 'ต้องมีรูปอย่างน้อย 2 ครั้ง' : 'ยังไม่มีรูป'}</div></figure>`;
  let diff = '';

    diff = `<div class="cmp-diff">${METRICS.map(m => { const a = num(before[m.k]), b = num(latest[m.k]); if (a == null || b == null) return ''; const d = b - a; return `<span class="pill ${d <= 0 ? 'good' : 'warn'}">${m.th} ${signed(d)} ${m.u}</span>`; }).join('')}</div>`;

    ${withPhoto.length ? `<div class="compare">${fig(before, 'ก่อน')}${fig(latest, 'ล่าสุด')}</div>${diff}
      ${options.length > 1 ? `<div class="field" style="margin:14px 0 0"><label>เลือกวันที่ "ก่อน"</label><select class="inp" id="beforeSel">${options.map(r => `<option value="${esc(r.id)}" ${before && r.id === before.id ? 'selected' : ''}>${thDate(r.date, { day: 'numeric', month: 'long', year: 'numeric' })}</option>`).join('')}</select></div>` : ''}`
      : `<div class="empty" style="padding:18px 10px 8px"><div class="eic">${icon('camera')}</div><p>ยังไม่มีรูป${POSES.find(p => p.k === pk).th}<br><span class="small">เพิ่มรูปได้ตอนบันทึกสัดส่วน</span></p><button class="btn btn-ghost" data-add="body">${icon('camera')}บันทึกพร้อมรูป</button></div>`}`;

}

/* ---------- Image ---------- */
function compressImage(file, max = 1280, q = 0.82, square = false) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
      const s = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * s), h = Math.round(sh * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปนี้ไม่ได้ ลองเลือกรูปอื่น')); };
    img.src = url;
  });
}

    </form>`, root => {
    const f = $('#profF', root), fi = $('#avFile', root), av = $('#avBtn', root);
    let photoData = null, removePhoto = false;
    const pick = () => { fi.value = ''; fi.click(); };
    av.addEventListener('click', pick);
    $('#avChange', root).addEventListener('click', pick);
    $('#avRemove', root).addEventListener('click', () => {
      photoData = null; removePhoto = !!p.photoUrl;
      const im = $('img', av); if (im) im.remove();
      $('#avRemove', root).hidden = true; $('#avChange', root).textContent = 'เพิ่มรูปโปรไฟล์';
    });
    fi.addEventListener('change', async () => {
      const file = fi.files[0]; if (!file) return;
      try {
        photoData = await compressImage(file, 600, 0.86, true); removePhoto = false;
        let im = $('img', av); if (!im) { im = document.createElement('img'); im.alt = ''; av.insertBefore(im, $('.av-cam', av)); }
        im.src = photoData;
        $('#avRemove', root).hidden = false; $('#avChange', root).textContent = 'เปลี่ยนรูป';
      } catch (err) { toast(err.message, 'err'); }
    });
    f.name.addEventListener('input', () => { const sp = $('span', av); if (sp) sp.textContent = (f.name.value.trim().charAt(0) || 'U').toUpperCase(); });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(f));
      const btn = $('#pSave', root); setBtnLoading(btn, true, photoData ? 'กำลังอัปโหลดรูป…' : 'กำลังบันทึก…');
      try {
        const res = await apiPost({ action: 'saveProfile', pin: S.pin, data, photoData, removePhoto }); if (!res.ok) throw res;
        S.profile = res.item; cacheNow(); closeSheet(); renderAll(); toast('บันทึกโปรไฟล์แล้ว');
      } catch (err) { setBtnLoading(btn, false); handleErr(err); }
    });
  });
}

/* ---------- PIN ---------- */
let pinBuf = '', pinCb = null, pinBusy = false;
function drawDots() { $$('#dots i').forEach((d, i) => d.classList.toggle('f', i < pinBuf.length)); }
function openPin(cb) {
  pinCb = cb || null; pinBuf = ''; drawDots();
  $('#dots').className = 'dots'; const m = $('#pinMsg'); m.className = '';
  m.textContent = DEMO ? 'โหมดตัวอย่าง: ใส่ตัวเลข 6 หลักใดก็ได้' : 'ไม่ใส่ PIN จะดูข้อมูลได้อย่างเดียว';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#pin').classList.add('show');
}
function closePin() { $('#pin').classList.remove('show'); pinCb = null; pinBuf = ''; }
async function pinPress(k) {
  if (pinBusy) return;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 6) pinBuf += k;
  drawDots(); try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
  if (pinBuf.length < 6) return;
  pinBusy = true; const dots = $('#dots'), msg = $('#pinMsg');
  dots.className = 'dots wait'; msg.className = ''; msg.textContent = 'กำลังตรวจสอบ…';
  let res; try { res = await apiPost({ action: 'verify', pin: pinBuf }); } catch (e) { res = { ok: false, error: 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง' }; }
  if (res.ok) {
    S.unlocked = true; S.pin = pinBuf; sess.set('mj.pin', pinBuf);
    dots.className = 'dots okk'; msg.textContent = 'ปลดล็อกแล้ว';
    const cb = pinCb;
    setTimeout(() => { closePin(); renderAll(); if (cb) cb(); else toast('โหมดแก้ไขเปิดแล้ว'); pinBusy = false; }, 450);
    return;
  }
  dots.className = 'dots'; void dots.offsetWidth; dots.classList.add('shake');
  msg.className = 'err'; msg.textContent = res.error || 'PIN ไม่ถูกต้อง';
  try { navigator.vibrate && navigator.vibrate([40, 60, 40]); } catch (e) {}
  pinBuf = ''; setTimeout(drawDots, 300);
  pinBusy = false;
}
function lockNow() { S.unlocked = false; S.pin = null; sess.set('mj.pin', null); renderAll(); }

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const lb = t.closest('[data-lb]'); if (lb && !t.closest('form')) { openLb(lb.dataset.lb); return; }
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (t.closest('[data-close]')) { closeSheet(); return; }
  const a = t.closest('[data-add]'); if (a) { const k = a.dataset.add; requireUnlock(() => k === 'meal' ? mealForm() : bodyForm()); return; }
  const per = t.closest('[data-period]'); if (per) { S.anaP = +per.dataset.period; store.set('mj.anaP', S.anaP); $$('#pseg button').forEach(x => x.classList.toggle('on', x === per)); renderAnalysis(false); return; }
  const at = t.closest('[data-ana-tab]'); if (at) { S.anaTab = at.dataset.anaTab; store.set('mj.anaTab', S.anaTab); $$('.ana-tabs .chip').forEach(x => x.classList.toggle('on', x === at)); renderAnaTab(null, false); return; }
  const gd = t.closest('[data-goday]'); if (gd) { S.selDate = gd.dataset.goday; go('meals'); return; }
  const m = t.closest('[data-meal]'); if (m) { mealDetail(m.dataset.meal); return; }
  const b = t.closest('[data-body]'); if (b) { bodyDetail(b.dataset.body); return; }
  const d = t.closest('[data-date]'); if (d) { S.selDate = d.dataset.date; renderMeals(); return; }
  const mt = t.closest('[data-metric]'); if (mt) { S.metric = mt.dataset.metric; $$('#mchips .chip').forEach(c => c.classList.toggle('on', c === mt)); drawBodyChart(); return; }
  const pt = t.closest('[data-pose-tab]'); if (pt) { S.pose = pt.dataset.poseTab; S.beforeId = null; renderCompare(); return; }
  if (t.closest('[data-edit-profile]')) { requireUnlock(profileForm); return; }
  if (t.closest('#refreshBtn')) { const btn = t.closest('#refreshBtn'); setBtnLoading(btn, true, 'กำลังโหลด…'); load(true).then(ok => { if (ok) toast('อัปเดตข้อมูลล่าสุดแล้ว'); }); return; }
  if (t.closest('#lockBtn')) { S.unlocked ? (lockNow(), toast('ล็อกแล้ว — ดูได้อย่างเดียว')) : openPin(); return; }
});
$('#overlay').addEventListener('click', () => closeSheet());
$('#lb').addEventListener('click', closeLb);
$('#fab').addEventListener('click', () => requireUnlock(chooseAdd));
$('#modeBtn').addEventListener('click', () => S.unlocked ? (lockNow(), toast('ล็อกแล้ว — ดูได้อย่างเดียว')) : openPin());
$('#pinClose').addEventListener('click', closePin);
document.addEventListener('keydown', e => {
  if ($('#lb').classList.contains('show')) { if (e.key === 'Escape') closeLb(); return; }
  if (!$('#pin').classList.contains('show')) { if (e.key === 'Escape') closeSheet(); return; }
  if (/^\d$/.test(e.key)) pinPress(e.key); else if (e.key === 'Backspace') pinPress('del'); else if (e.key === 'Escape') closePin();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.loaded && !sheetOpen && !DEMO) load(true); });

/* ---------- Static UI ---------- */
function buildStatic() {
  $('#brandMark').innerHTML = icon('meal');
  $$('.nav .tab').forEach(b => { const [ic, lb] = NAV[b.dataset.go]; b.innerHTML = icon(ic) + '<span>' + lb + '</span>'; });
  $('#fab').innerHTML = icon('plus');
  $('#pinClose').innerHTML = icon('x');
  $('#lb .xbtn').innerHTML = icon('x');
  $('#pinLock').innerHTML = icon('lock');
  $('#keys').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k === '' ? '<button class="blank" tabindex="-1" aria-hidden="true"></button>' : k === 'del' ? `<button class="del" data-k="del" aria-label="ลบ">${icon('back')}</button>` : `<button data-k="${k}">${k}</button>`).join('');
  $('#keys').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) pinPress(b.dataset.k); });
}
function skeleton() {
  $('#page-home').innerHTML = `<div class="skel" style="height:168px;margin-bottom:14px"></div><div class="skel" style="height:150px;margin-bottom:14px"></div><div class="stats">${'<div class="skel" style="height:100px"></div>'.repeat(4)}</div>`;
}

/* ---------- Load ---------- */
function hideSplash() { $('#splash').classList.add('hide'); }
async function load(quiet) {
  const cached = !DEMO && !S.loaded ? store.get(CONFIG.CACHE_KEY) : null;
  if (cached) { applyData(cached); renderAll(); hideSplash(); }
  let ok = true;
  try {
    const res = await apiGet();
    if (!res || !res.ok) throw new Error((res && res.error) || 'โหลดข้อมูลไม่สำเร็จ');
    applyData(res.data); S.loaded = true; cacheNow();
    if (!sheetOpen) renderAll();
  } catch (err) {
    ok = false;
    toast('โหลดข้อมูลไม่สำเร็จ: ' + (/Failed to fetch|Load failed/i.test(err.message) ? 'ตรวจสอบอินเทอร์เน็ต' : err.message), 'err');
    if (!cached && !quiet) renderAll();
    const rb = $('#refreshBtn'); if (rb) setBtnLoading(rb, false);
  }
  hideSplash();
  return ok;
}

buildStatic();
const savedPin = sess.get('mj.pin'); if (savedPin) { S.pin = savedPin; S.unlocked = true; }
renderHero(); skeleton();
load();
</script>
</body>
</html>
